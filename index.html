<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>シールコレクション AI</title>

  <style>

    :root{
      --blue:#1677ff;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#f59e0b;
      --bg:#f5f7fb;
      --line:#dde3ee;
      --text:#172033;
      --sub:#667085
    }

    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,
        "Segoe UI",sans-serif;
      color:var(--text)
    }

    main{
      max-width:680px;
      margin:auto;
      padding:20px 14px 42px
    }

    h1{
      font-size:23px;
      text-align:center;
      margin:8px 0 4px
    }

    .lead{
      text-align:center;
      color:var(--sub);
      font-size:13px;
      margin:0 0 18px
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 2px 10px #16213a0a
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between
    }

    .muted,
    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.5
    }

    .hint{
      margin-top:7px
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:0 0 6px
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px;
      font:inherit;
      background:#fff
    }

    textarea{
      min-height:72px;
      resize:vertical
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px
    }

    .photo{
      border:2px dashed #b8c3d6;
      border-radius:13px;
      min-height:160px;
      padding:10px;
      text-align:center;
      cursor:pointer;
      color:var(--sub);
      font-size:13px
    }

    .photo img{
      width:100%;
      height:118px;
      object-fit:contain;
      display:none;
      margin-top:8px
    }

    .photo input{
      display:none
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 14px;
      background:var(--blue);
      color:#fff;
      font-weight:700;
      font-size:14px;
      cursor:pointer
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed
    }

    .btn.secondary{
      background:#eef4ff;
      color:#125dc9
    }

    .btn.green{
      background:var(--green)
    }

    .btn.red{
      background:var(--red)
    }

    .btn.small{
      padding:8px 10px;
      font-size:12px;
      width:auto
    }

    .full{
      width:100%;
      margin-top:12px
    }

    .status{
      display:none;
      margin-top:11px;
      padding:10px;
      border-radius:9px;
      background:#eff6ff;
      color:#1957a7;
      font-size:13px;
      white-space:pre-wrap

    .error{
      display:none;
      margin-top:11px;
      padding:10px;
      border-radius:9px;
      background:#fff1f2;
      color:#a9162b;
      font-size:13px;
      white-space:pre-wrap
    }

    .result{
      display:none
    }

    .fields{
      display:grid;
      gap:10px
    }

    .price-box{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-top:4px
    }

    .price-title{
      font-size:12px;
      font-weight:700;
      color:var(--sub);
      margin-bottom:5px

      font-size:20px;
      font-weight:800;

      font-size:12px;
      line-height:1.6;
      color:var(--sub);

      padding:12px 0;

      height:64px;

      color:#17643b;
      background:#e9f9ef;
      padding:5px 8px;

    .hidden{
      display:none

    @media(max-width:390px){

      .grid{

      }

<script>

/* =========================================================
   pCloud Client ID
========================================================= */

const PCLOUD_CLIENT_ID =
  'PASTE_YOUR_PCLOUD_CLIENT_ID_HERE';


/* =========================================================
   Gemini
========================================================= */

const GEMINI_MODEL =
  'gemini-3.6-flash';


/* =========================================================
   pCloud
========================================================= */

const ROOT_FOLDER =
  'シールコレクション';


/* =========================================================
   共通
========================================================= */

const $ =
  id => document.getElementById(id);


const store =
  localStorage;


let analysis = null;


let records = [];


/* =========================================================
   ステータス
========================================================= */

function setStatus(text){

  $('status').textContent =
    text;

  $('status').style.display =
    text
    ? 'block'
    : 'none';

}


function fail(error){

  console.error(error);

  $('error').textContent =
    error.message ||
    String(error);

  $('error').style.display =
    'block';

}


function clearMessage(){

  $('error').style.display =
    'none';

  setStatus('');

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function esc(text){

  return String(text ?? '')
    .replace(
      /[&<>"']/g,
      c => ({

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[c])
    );

}


/* =========================================================
   ID
========================================================= */

function uid(){

  return Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2,8);

}


/* =========================================================
   MIME
========================================================= */

function mime(file){

  return file.type ||
    'image/jpeg';

}


/* =========================================================
   プレビュー
========================================================= */

function preview(
  input,
  image
){

  const file =
    input.files[0];

  if(!file)
    return;


  const reader =
    new FileReader();


  reader.onload = () => {

    image.src =
      reader.result;

    image.style.display =
      'block';

  };


  reader.readAsDataURL(
    file
  );

}


$('front').onchange =
  () =>
    preview(
      $('front'),
      $('frontPreview')
    );


$('back').onchange =
  () =>
    preview(
      $('back'),
      $('backPreview')
    );


/* =========================================================
   API Key
========================================================= */

function saveKey(){

  store.setItem(
    'stickerGeminiKey',
    $('apiKey')
      .value
      .trim()
  );

}


/* =========================================================
   pCloud
========================================================= */

function apiHost(){

  return store.getItem(
    'pcloudHost'
  )
  ||
  'api.pcloud.com';

}


function token(){

  return store.getItem(
    'pcloudToken'
  );

}


function updateCloud(){

  const connected =
    !!token();


  $('cloudState').textContent =
    connected
    ? '接続済み'
    : '未接続';


  $('loginBtn')
    .classList
    .toggle(
      'hidden',
      connected
    );


  $('logoutBtn')
    .classList
    .toggle(
      'hidden',
      !connected
    );

}


function redirectURI(){

  return location.href
    .split('#')[0];

}


/* =========================================================
   pCloud接続
========================================================= */

function connect(){

  if(
    PCLOUD_CLIENT_ID.includes(
      'PASTE_'
    )
  ){

    throw Error(
      'PCLOUD_CLIENT_ID に承認後の Client ID を入力してください。'
    );

  }


  if(
    location.protocol === 'file:'
  ){

    throw Error(
      'このHTMLはHTTPSで公開してから使ってください。'
    );

  }


  const state =
    uid();


  store.setItem(
    'pcloudState',
    state
  );


  const params =
    new URLSearchParams({

      client_id:
        PCLOUD_CLIENT_ID,

      response_type:
        'token',

      redirect_uri:
        redirectURI(),

      state

    });


  location.href =
    'https://my.pcloud.com/oauth2/authorize?'
    +
    params;

}


/* =========================================================
   OAuth
========================================================= */

function readOAuth(){

  if(!location.hash)
    return;


  const params =
    new URLSearchParams(
      location.hash.slice(1)
    );


  if(
    params.get(
      'access_token'
    )
  ){

    if(
      params.get('state')
      !==
      store.getItem(
        'pcloudState'
      )
    ){

      throw Error(
        'pCloud認証の確認値が一致しません。もう一度接続してください。'
      );

    }


    store.setItem(
      'pcloudToken',
      params.get(
        'access_token'
      )
    );


    store.setItem(
      'pcloudHost',
      params.get(
        'hostname'
      )
      ||
      'api.pcloud.com'
    );


    history.replaceState(
      null,
      '',
      redirectURI()
    );

  }


  else if(
    params.get('error')
  ){

    throw Error(
      'pCloud認証が完了しませんでした: '
      +
      params.get('error')
    );

  }

}


/* =========================================================
   pCloud API
========================================================= */

async function pcall(
  method,
  params = {},
  form = null
){

  if(!token()){

    throw Error(
      '先に pCloud に接続してください。'
    );

  }


  const url =
    'https://'
    +
    apiHost()
    +
    '/'
    +
    method;


  let options;


  if(form){

    form.append(
      'access_token',
      token()
    );


    options = {

      method:'POST',

      body:form

    };

  }


  else{

    options = {

      method:'POST',

      headers:{

        'Content-Type':
          'application/x-www-form-urlencoded'

      },

      body:
        new URLSearchParams({

          ...params,

          access_token:
            token()

        })

    };

  }


  let response;


  try{

    response =
      await fetch(
        url,
        options
      );

  }

  catch{

    throw Error(
      'pCloudへ接続できませんでした。'
    );

  }


  let data;


  try{

    data =
      await response.json();

  }

  catch{

    throw Error(
      'pCloudから正しい応答が返りませんでした。'
    );

  }


  if(
    !response.ok
    ||
    data.result !== 0
  ){

    throw Error(
      'pCloudエラー: '
      +
      (
        data.error
        ||
        data.result
        ||
        response.status
      )
    );

  }


  return data;

}


/* =========================================================
   pCloudルート
========================================================= */

async function root(){

  const data =
    await pcall(
      'createfolderifnotexists',
      {

        folderid:0,

        name:
          ROOT_FOLDER

      }
    );


  return data.metadata.folderid;

}


/* =========================================================
   Upload
========================================================= */

async function upload(
  folderid,
  file,
  filename
){

  const form =
    new FormData();


  form.append(
    'folderid',
    folderid
  );


  form.append(
    'nopartial',
    '1'
  );


  form.append(
    'renameifexists',
    '0'
  );


  form.append(
    'file',
    file,
    filename
  );


  return pcall(
    'uploadfile',
    {},
    form
  );

}


/* =========================================================
   AIプロンプト
========================================================= */

function prompt(){

画像の表面・裏面を確認して、

価格は単なる推測ではなく、

/* =========================================================
   Base64
========================================================= */

async function b64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload = () => {

        resolve(
          String(
            reader.result
          )
          .split(',')[1]
        );

      };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   JSON解析
========================================================= */

function jsonFromText(text){

  const cleaned =
    text
      .replace(
        /^```(?:json)?/gm,
        ''
      )
      .replace(
        /```$/gm,
        ''
      )
      .trim();


  return JSON.parse(
    cleaned
  );

}


/* =========================================================
   AI判定
========================================================= */

async function scan(){

  clearMessage();


  const key =
    $('apiKey')
      .value
      .trim();


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!key){

    throw Error(
      'Gemini API Keyを入力してください。'
    );

  }


  if(!front){

    throw Error(
      '表面の画像を選択してください。'
    );

  }


  saveKey();


  $('scanBtn').disabled =
    true;


  try{

    setStatus(
      '①画像を解析しています…'
    );


    const parts = [

      {

        text:
          prompt()

      },

      {

        inline_data:{

          mime_type:
            mime(front),

          data:
            await b64(front)

        }

      }

    ];


    if(back){

      parts.push({

        inline_data:{

          mime_type:
            mime(back),

          data:
            await b64(back)

        }

      });

    }


    setStatus(
      '②Google検索で商品情報と相場を調査しています…'
    );


    /*
     * Gemini GenerateContent API
     *
     * 2026年8月現在のREST形式
     */

    const requestBody = {

      contents:[

        {

          role:'user',

          parts:parts

        }

      ],


      tools:[

        {

          googleSearch:{}

        }

      ],


      generationConfig:{

        maxOutputTokens:
          1200,

        temperature:
          0.2,

        responseMimeType:
          'application/json',

        responseSchema:{

          type:'object',

          properties:{

            name:{

              type:'string',

              description:
                '商品名・シール名'

            },


            series:{

              type:'string',

              description:
                'シリーズ・作品名・弾数など'

            },


            kind:{

              type:'string',

              enum:[

                'シール',
                'トレカ',
                '食玩'

              ]

            },


            rarity:{

              type:'string',

              enum:[

                'N',
                'R',
                'SR',
                'SSR',
                'SC',
                'UR',
                'SEC',
                'PR',
                '不明'

              ]

            },


            price:{

              type:'string',

              description:
                '現在の推定相場。例：約3000円。確認できない場合は確認できません'

            },


            priceReference:{

              type:'string',

              description:
                'まんだらけ・メルカリ等で確認した価格情報と判断根拠'

            },


            memo:{

              type:'string',

              description:
                '商品特定の根拠、状態、注意点など'

            }

          },


          required:[

            'name',
            'series',
            'kind',
            'rarity',
            'price',
            'priceReference',
            'memo'

          ]

        }

      }

    };


    console.log(
      'Gemini request:',
      requestBody
    );


    const response =
      await fetch(

        'https://generativelanguage.googleapis.com/v1beta/models/'
        +
        GEMINI_MODEL
        +
        ':generateContent',

        {

          method:'POST',

          headers:{

            'Content-Type':
              'application/json',

            'x-goog-api-key':
              key

          },

          body:
            JSON.stringify(
              requestBody
            )

        }

      );


    const data =
      await response.json();


    console.log(
      'Gemini response:',
      data
    );


    if(!response.ok){

      throw Error(
        'Geminiエラー: '
        +
        (
          data.error?.message
          ||
          JSON.stringify(data)
        )
      );

    }


    const candidate =
      data
        .candidates?.[0];


    if(!candidate){

      throw Error(
        'Geminiから解析結果が返ってきませんでした。'
      );

    }


    const text =
      candidate
        ?.content
        ?.parts
        ?.map(
          part =>
            part.text || ''
        )
        .join('')
        ||
        '';


    if(!text){

      throw Error(
        'Geminiから解析結果が返ってきませんでした。'
      );

    }


    analysis =
      jsonFromText(
        text
      );


    /* =====================================================
       結果表示
    ====================================================== */

    $('name').value =
      analysis.name || '';


    $('series').value =
      analysis.series || '';


    const validKinds = [

      'シール',
      'トレカ',
      '食玩'

    ];


    $('kind').value =
      validKinds.includes(
        analysis.kind
      )
      ?
      analysis.kind
      :
      'シール';


    const validRarity = [

      'N',
      'R',
      'SR',
      'SSR',
      'SC',
      'UR',
      'SEC',
      'PR',
      '不明'

    ];


    $('rarity').value =
      validRarity.includes(
        analysis.rarity
      )
      ?
      analysis.rarity
      :
      '不明';


    $('price').value =
      analysis.price || '';


    $('priceReference').value =
      analysis.priceReference || '';


    $('memo').value =
      analysis.memo || '';


    $('priceDisplay').textContent =
      analysis.price ||
      '確認できません';


    $('priceReferenceDisplay')
      .textContent =
        analysis.priceReference ||
        '価格情報を確認できませんでした。';


    $('resultCard')
      .style.display =
      'block';


    setStatus(
      '③判定・相場調査が完了しました。内容を確認してください。'
    );

  }


  finally{

    $('scanBtn').disabled =
      false;

  }

}


/* =========================================================
   現在のデータ
========================================================= */

function current(){

  return {

    id:
      uid(),

    name:
      $('name')
        .value
        .trim()
      ||
      '名称未設定',

    series:
      $('series')
        .value
        .trim(),

    kind:
      $('kind').value,

    rarity:
      $('rarity').value,

    price:
      $('price')
        .value
        .trim(),

    priceReference:
      $('priceReference')
        .value
        .trim(),

    memo:
      $('memo')
        .value
        .trim(),

    savedAt:
      new Date()
        .toISOString()

  };

}


/* =========================================================
   pCloud保存
========================================================= */

async function save(){

  clearMessage();


  if(!analysis){

    throw Error(
      '先にAIで判定してください。'
    );

  }


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!front){

    throw Error(
      '表面の画像がありません。'
    );

  }


  if(!token()){

    throw Error(
      '先にpCloudに接続してください。'
    );

  }


  $('saveBtn').disabled =
    true;


  try{

    setStatus(
      'pCloudに保存しています…'
    );


    const rootFolderId =
      await root();


    const item =
      current();


    const folder =
      await pcall(
        'createfolderifnotexists',
        {

          folderid:
            rootFolderId,

          name:
            'item-' +
            item.id

        }
      );


    const folderid =
      folder.metadata.folderid;


    const ext =
      file => {

        return (

          file.name
            .split('.')
            .pop()
          ||
          'jpg'

        )
        .replace(
          /[^a-z0-9]/gi,
          ''
        )
        .toLowerCase();

      };


    /* 表面 */

    await upload(
      folderid,
      front,
      'front.' +
      ext(front)
    );


    /* 裏面 */

    if(back){

      await upload(
        folderid,
        back,
        'back.' +
        ext(back)
      );

    }


    /* データ */

    const dataFile =
      new File(

        [
          JSON.stringify(
            item,
            null,
            2
          )
        ],

        'data.json',

        {
          type:
            'application/json'
        }

      );


    await upload(
      folderid,
      dataFile,
      'data.json'
    );


    item.folderid =
      folderid;


    item.preview =
      $('frontPreview').src;


    records.unshift(
      item
    );


    render();


    setStatus(
      'pCloudに保存しました。'
    );

  }


  finally{

    $('saveBtn').disabled =
      false;

  }

}


/* =========================================================
   一覧更新
========================================================= */

async function refresh(){

  clearMessage();


  if(!token()){

    throw Error(
      '先にpCloudに接続してください。'
    );

  }


  setStatus(
    'pCloudのフォルダ一覧を取得しています…'
  );


  const rootFolderId =
    await root();


  const data =
    await pcall(
      'listfolder',
      {

        folderid:
          rootFolderId,

        recursive:0

      }
    );


  const folders =
    (
      data
        .metadata
        .contents
      ||
      []
    )
    .filter(
      item =>
        item.isfolder
        &&
        item.name.startsWith(
          'item-'
        )
    );


  records =
    folders.map(
      folder => ({

        id:
          folder.name.slice(5),

        folderid:
          folder.folderid,

        name:
          '保存済みアイテム',

        series:'',

        kind:'',

        rarity:'',

        price:'',

        priceReference:'',

        memo:'',

        savedAt:
          folder.modified

      })
    );


  render();


  setStatus(
    '一覧を更新しました。'
  );

}


/* =========================================================
   削除
========================================================= */

async function del(id){

  const record =
    records.find(
      item =>
        item.id === id
    );


  if(!record)
    return;


  if(
    !confirm(
      'このアイテムをpCloudから削除します。よろしいですか？'
    )
  ){

    return;

  }


  clearMessage();


  try{

    setStatus(
      'pCloudから削除しています…'
    );


    await pcall(
      'deletefolderrecursive',
      {

        folderid:
          record.folderid

      }
    );


    records =
      records.filter(
        item =>
          item.id !== id
      );


    render();


    setStatus(
      '削除しました。'
    );

  }


  catch(error){

    fail(error);

  }

}


/* =========================================================
   一覧表示
========================================================= */

function render(){

  if(!records.length){

    $('list').innerHTML =
      '<p class="muted">まだ保存されていません。</p>';

    return;

  }


  $('list').innerHTML =
    records
      .map(
        record => `

          <div class="item">

            <img
              class="thumb"
              src="${record.preview || ''}"
              alt=""
              onerror="this.style.visibility='hidden'"
            >


            <div class="grow">

              <h3>
                ${esc(record.name)}
              </h3>


              <p>

                ${esc(record.series)}

                　

                ${esc(record.kind)}

                　

                ${esc(record.rarity)}

              </p>


              <p>

                ${esc(record.price)}

                　

                ${
                  record.savedAt
                  ?
                  new Date(
                    record.savedAt
                  )
                  .toLocaleDateString(
                    'ja-JP'
                  )
                  :
                  ''
                }

              </p>


              ${
                record.priceReference
                ?
                `<p>${esc(record.priceReference)}</p>`
                :
                ''
              }

            </div>


            <button
              class="btn small red"
              onclick="del('${record.id}')">

              削除

            </button>

          </div>

        `
      )
      .join('');

}


/* =========================================================
   ボタン
========================================================= */

$('loginBtn').onclick =
  () => {

    try{

      connect();

    }

    catch(error){

      fail(error);

    }

  };


$('logoutBtn').onclick =
  () => {

    store.removeItem(
      'pcloudToken'
    );

    store.removeItem(
      'pcloudHost'
    );

    updateCloud();

    records = [];

    render();

  };


$('scanBtn').onclick =
  () =>
    scan().catch(
      fail
    );


$('saveBtn').onclick =
  () =>
    save().catch(
      fail
    );


$('refreshBtn').onclick =
  () =>
    refresh().catch(
      fail
    );


/* =========================================================
   初期化
========================================================= */

try{

  readOAuth();

}

catch(error){

  fail(error);

}


$('apiKey').value =
  store.getItem(
    'stickerGeminiKey'
  )
  ||
  '';


updateCloud();

render();

</script>
