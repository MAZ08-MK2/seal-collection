<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>コレクションAIスキャン</title>

  <style>

    :root {
      --primary: #007AFF;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --subtext: #6c6c70;
      --border: #c6c6c8;
      --success: #34c759;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;

      background: var(--bg);

      margin: 0;

      padding: 16px;

      color: var(--text);
    }

    h1 {
      font-size: 1.3rem;

      text-align: center;

      margin: 8px 0 4px;
    }

    .ver-badge {
      text-align: center;

      font-size: 0.8rem;

      color: var(--success);

      font-weight: bold;

      margin-bottom: 16px;
    }

    .card {
      background: var(--card);

      border-radius: 14px;

      padding: 16px;

      margin-bottom: 16px;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.05);
    }

    label {
      font-size: 0.85rem;

      font-weight: bold;

      color: var(--subtext);

      display: block;

      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;

      padding: 12px;

      border: 1px solid var(--border);

      border-radius: 8px;

      margin-bottom: 8px;

      font-size: 0.9rem;

      background: #fff;
    }

    .key-hint {
      font-size: 0.75rem;

      color: #8e8e93;

      line-height: 1.45;
    }

    .upload-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-bottom: 16px;
    }

    .upload-box {
      border: 2px dashed #c6c6c8;

      border-radius: 10px;

      padding: 12px;

      text-align: center;

      background: #fafafa;

      position: relative;

      cursor: pointer;

      min-height: 150px;
    }

    .upload-box:active {
      background: #eeeeee;
    }

    .upload-box span {
      display: block;

      font-size: 0.85rem;

      font-weight: bold;

      color: #555;

      margin-bottom: 4px;
    }

    .upload-box input {
      display: none;
    }

    .upload-box img {
      width: 100%;

      height: 105px;

      object-fit: contain;

      display: none;

      margin-top: 8px;

      border-radius: 5px;
    }

    .btn {
      background: var(--primary);

      color: white;

      border: none;

      width: 100%;

      padding: 14px;

      border-radius: 10px;

      font-weight: bold;

      font-size: 1rem;

      cursor: pointer;
    }

    .btn:disabled {
      background: #a2a2a7;

      cursor: not-allowed;
    }

    .save-btn {
      background: var(--success);

      margin-top: 12px;
    }

    .clear-btn {
      background: var(--danger);

      margin-top: 10px;

      padding: 11px;

      font-size: 0.85rem;
    }

    #result {
      display: none;

      white-space: pre-wrap;

      font-size: 0.9rem;

      line-height: 1.6;

      background: #eef6ff;

      border-left: 4px solid var(--primary);

      padding: 12px;

      border-radius: 5px;

      word-break: break-word;
    }

    .error-box {
      display: none;

      white-space: pre-wrap;

      font-size: 0.85rem;

      line-height: 1.55;

      background: #fff2f2;

      border-left: 4px solid var(--danger);

      padding: 12px;

      border-radius: 5px;

      margin-top: 12px;

      color: #8b0000;
    }

    .status {
      display: none;

      text-align: center;

      font-size: 0.82rem;

      color: #6c6c70;

      margin-top: 12px;

      line-height: 1.5;
    }

    .collection-item {
      display: flex;

      align-items: center;

      gap: 12px;

      border-bottom: 1px solid #e5e5ea;

      padding: 10px 0;
    }

    .collection-item:last-child {
      border-bottom: none;
    }

    .collection-item img {
      width: 58px;

      height: 58px;

      object-fit: cover;

      border-radius: 6px;

      background: #f2f2f7;

      flex-shrink: 0;
    }

    .collection-info {
      flex: 1;

      min-width: 0;
    }

    .collection-title {
      font-size: 0.85rem;

      font-weight: bold;

      line-height: 1.4;

      word-break: break-word;
    }

    .collection-date {
      font-size: 0.7rem;

      color: #8e8e93;

      margin-top: 4px;
    }

    .empty {
      color: #8e8e93;

      font-size: 0.85rem;

      text-align: center;

      padding: 15px 0;
    }

    .model-info {
      font-size: 0.7rem;

      color: #8e8e93;

      text-align: center;

      margin-top: 8px;
    }

    @media (max-width: 480px) {

      body {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .upload-grid {
        gap: 8px;
      }

    }

  </style>

</head>

<body>


  <h1>✨ コレクションAIスキャン</h1>

  <div class="ver-badge">
    App Version: 8.3.2
  </div>


  <!-- APIキー -->

  <div class="card">

    <label for="apiKey">
      Gemini API Key
    </label>

    <input
      type="password"
      id="apiKey"
      placeholder="Gemini APIキーを貼り付け"
      autocomplete="off"
    >

    <div class="key-hint">
      ※APIキーはこのブラウザのlocalStorageに保存されます。<br>
      ※APIキーは他人と共有しないでください。
    </div>

  </div>


  <!-- 画像 -->

  <div class="card">

    <div class="upload-grid">


      <!-- 表面 -->

      <div
        class="upload-box"
        onclick="document.getElementById('imgFront').click()"
      >

        <span>
          🖼 表面の画像
        </span>

        <input
          type="file"
          id="imgFront"
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
          onchange="previewImage(this, 'prevFront')"
        >

        <img
          id="prevFront"
          alt="表面画像"
        >

      </div>


      <!-- 裏面 -->

      <div
        class="upload-box"
        onclick="document.getElementById('imgBack').click()"
      >

        <span>
          🖼 裏面の画像
        </span>

        <input
          type="file"
          id="imgBack"
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
          onchange="previewImage(this, 'prevBack')"
        >

        <img
          id="prevBack"
          alt="裏面画像"
        >

      </div>

    </div>


    <button
      class="btn"
      id="scanBtn"
      onclick="analyzeImages()"
    >
      AIで判定 & 相場分析
    </button>


    <div
      class="status"
      id="status"
    >
      AIが画像を解析しています...
    </div>


    <div
      class="model-info"
      id="modelInfo"
    >
      使用モデル：Gemini 3.5 Flash-Lite
    </div>


    <div
      class="error-box"
      id="errorBox"
    ></div>

  </div>


  <!-- 結果 -->

  <div
    class="card"
    id="resultCard"
    style="display:none;"
  >

    <label>
      解析結果
    </label>

    <div id="result"></div>

    <button
      class="btn save-btn"
      onclick="saveToCollection()"
    >
      💾 コレクションに保存
    </button>

  </div>


  <!-- コレクション -->

  <div class="card">

    <label>
      マイコレクション
    </label>

    <div id="collectionList"></div>

    <button
      class="btn clear-btn"
      onclick="clearCollection()"
    >
      コレクションをすべて削除
    </button>

  </div>


<script>


  /*
   ============================================================
   コレクトAI v8.3.2
   ============================================================

   使用モデル

   第1候補：
   gemini-3.5-flash-lite

   第2候補：
   gemini-3.6-flash

   503 / 429 の場合は自動再試行します。
   ============================================================
  */


  const MODELS = [

    "gemini-3.5-flash-lite",

    "gemini-3.6-flash"

  ];


  const API_BASE_URL =
    "https://generativelanguage.googleapis.com/v1beta/models/";


  let currentAnalysis = null;


  /*
   ============================================================
   起動
   ============================================================
  */

  window.onload = function () {

    const savedKey =
      localStorage.getItem(
        "gemini_api_key"
      );


    if (savedKey) {

      document.getElementById(
        "apiKey"
      ).value = savedKey;

    }


    renderCollection();

  };


  /*
   ============================================================
   APIキー保存
   ============================================================
  */

  function saveApiKey(value) {

    const key =
      value.trim();


    if (key) {

      localStorage.setItem(
        "gemini_api_key",
        key
      );

    }

  }


  /*
   ============================================================
   画像プレビュー
   ============================================================
  */

  function previewImage(
    input,
    previewId
  ) {

    if (
      !input.files ||
      !input.files[0]
    ) {

      return;

    }


    const file =
      input.files[0];


    const reader =
      new FileReader();


    reader.onload =
      function (event) {

        const img =
          document.getElementById(
            previewId
          );


        img.src =
          event.target.result;


        img.style.display =
          "block";

      };


    reader.onerror =
      function () {

        alert(
          "画像の読み込みに失敗しました。"
        );

      };


    reader.readAsDataURL(file);

  }


  /*
   ============================================================
   File → Base64
   ============================================================
  */

  function fileToBase64(file) {

    return new Promise(
      function (resolve, reject) {

        const reader =
          new FileReader();


        reader.onload =
          function () {

            try {

              const result =
                reader.result;


              const base64 =
                result.split(",")[1];


              resolve(base64);

            } catch (error) {

              reject(error);

            }

          };


        reader.onerror =
          function (error) {

            reject(error);

          };


        reader.readAsDataURL(file);

      }
    );

  }


  /*
   ============================================================
   エラー表示
   ============================================================
  */

  function showError(message) {

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.innerText =
      message;


    errorBox.style.display =
      "block";

  }


  function hideError() {

    const errorBox =
      document.getElementById(
        "errorBox"
      );


    errorBox.innerText =
      "";


    errorBox.style.display =
      "none";

  }


  /*
   ============================================================
   待機
   ============================================================
  */

  function sleep(ms) {

    return new Promise(
      function (resolve) {

        setTimeout(
          resolve,
          ms
        );

      }
    );

  }


  /*
   ============================================================
   Gemini API呼び出し
   ============================================================
  */

  async function callGemini(
    model,
    apiKey,
    parts
  ) {


    const url =
      API_BASE_URL +
      model +
      ":generateContent";


    const response =
      await fetch(
        url,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey

          },

          body:
            JSON.stringify({

              contents: [

                {

                  role: "user",

                  parts:
                    parts

                }

              ],

              generationConfig: {

                maxOutputTokens: 4000

              }

            })

        }
      );


    let data = null;


    try {

      data =
        await response.json();

    } catch (error) {

      throw new Error(
        "GeminiからJSON形式の回答を取得できませんでした。"
      );

    }


    return {

      response:
        response,

      data:
        data

    };

  }


  /*
   ============================================================
   Gemini API
   503 / 429 自動リトライ
   ============================================================
  */

  async function requestGemini(
    apiKey,
    parts
  ) {


    let lastError =
      null;


    /*
     * モデルを順番に試す
     */

    for (
      let modelIndex = 0;
      modelIndex < MODELS.length;
      modelIndex++
    ) {


      const model =
        MODELS[modelIndex];


      /*
       * 各モデル最大3回
       */

      for (
        let attempt = 1;
        attempt <= 3;
        attempt++
      ) {


        try {

          updateStatus(
            "AI解析中...\n" +
            model +
            "\n" +
            "試行 " +
            attempt +
            " / 3"
          );


          const result =
            await callGemini(
              model,
              apiKey,
              parts
            );


          const response =
            result.response;


          const data =
            result.data;


          /*
           * 成功
           */

          if (
            response.ok &&
            data.candidates &&
            data.candidates.length > 0
          ) {

            return {

              model:
                model,

              data:
                data

            };

          }


          /*
           * エラー内容
           */

          let errorMessage =
            "Gemini APIでエラーが発生しました。";


          if (
            data &&
            data.error &&
            data.error.message
          ) {

            errorMessage =
              data.error.message;

          }


          const status =
            response.status;


          lastError =
            new Error(
              "APIエラー (" +
              status +
              ")\n\n" +
              errorMessage
            );


          /*
           * 503 または429
           *
           * 一時的な混雑・レート制限
           */

          if (
            status === 503 ||
            status === 429
          ) {


            /*
             * 最後の試行でなければ待つ
             */

            if (
              attempt < 3
            ) {

              const waitTime =
                attempt === 1
                  ? 2500
                  : 5000;


              updateStatus(
                "Gemini側が混雑しています。\n" +
                Math.round(
                  waitTime / 1000
                ) +
                "秒後に再試行します..."
              );


              await sleep(
                waitTime
              );


              continue;

            }


            /*
             * このモデルは諦めて
             * 次のモデルへ
             */

            break;

          }


          /*
           * 400 / 401 / 403 / 404
           *
           * 再試行しても意味がない
           */

          throw lastError;


        } catch (error) {


          /*
           * ネットワークエラー
           */

          lastError =
            error;


          /*
           * fetch失敗なら再試行
           */

          if (
            attempt < 3
          ) {

            updateStatus(
              "通信を再試行しています..."
            );


            await sleep(
              2500
            );


            continue;

          }

        }

      }


      /*
       * 次のモデルへ
       */

      if (
        modelIndex <
        MODELS.length - 1
      ) {

        updateStatus(
          "別のGeminiモデルへ切り替えています..."
        );


        await sleep(
          1000
        );

      }

    }


    /*
     * 全部失敗
     */

    throw (
      lastError ||
      new Error(
        "Gemini APIに接続できませんでした。"
      )
    );

  }


  /*
   ============================================================
   ステータス
   ============================================================
  */

  function updateStatus(
    message
  ) {

    const status =
      document.getElementById(
        "status"
      );


    status.innerText =
      message;


    status.style.display =
      "block";

  }


  /*
   ============================================================
   AI解析
   ============================================================
  */

  async function analyzeImages() {


    hideError();


    const apiKey =
      document.getElementById(
        "apiKey"
      ).value.trim();


    const frontFile =
      document.getElementById(
        "imgFront"
      ).files[0];


    const backFile =
      document.getElementById(
        "imgBack"
      ).files[0];


    /*
     * APIキー確認
     */

    if (!apiKey) {

      alert(
        "Gemini APIキーを入力してください。"
      );

      return;

    }


    /*
     * 表面画像確認
     */

    if (!frontFile) {

      alert(
        "表面の画像を選択してください。"
      );

      return;

    }


    /*
     * APIキー保存
     */

    saveApiKey(
      apiKey
    );


    /*
     * ボタン
     */

    const btn =
      document.getElementById(
        "scanBtn"
      );


    btn.disabled =
      true;


    btn.innerText =
      "AI解析中...";


    try {


      /*
       * 表面画像をBase64化
       */

      updateStatus(
        "表面画像を読み込んでいます..."
      );


      const frontBase64 =
        await fileToBase64(
          frontFile
        );


      /*
       * Gemini parts
       */

      const parts = [];


      /*
       * プロンプト
       */

      parts.push({

        text:
          getPrompt()

      });


      /*
       * 表面画像
       */

      parts.push({

        inline_data: {

          mime_type:
            getMimeType(
              frontFile
            ),

          data:
            frontBase64

        }

      });


      /*
       * 裏面画像
       */

      if (backFile) {


        updateStatus(
          "裏面画像を読み込んでいます..."
        );


        const backBase64 =
          await fileToBase64(
            backFile
          );


        parts.push({

          inline_data: {

            mime_type:
              getMimeType(
                backFile
              ),

            data:
              backBase64

          }

        });

      }


      /*
       * Gemini API
       */

      updateStatus(
        "Gemini AIに画像を送信しています..."
      );


      const result =
        await requestGemini(
          apiKey,
          parts
        );


      /*
       * 使用モデル表示
       */

      const modelInfo =
        document.getElementById(
          "modelInfo"
        );


      modelInfo.innerText =
        "使用モデル：" +
        result.model;


      /*
       * テキスト取得
       */

      const data =
        result.data;


      let text =
        "";


      if (
        data.candidates &&
        data.candidates[0] &&
        data.candidates[0].content &&
        data.candidates[0].content.parts
      ) {


        data.candidates[0]
          .content
          .parts
          .forEach(
            function (part) {

              if (part.text) {

                text +=
                  part.text;

              }

            }
          );

      }


      /*
       * 結果が空
       */

      if (!text.trim()) {

        throw new Error(
          "AIから解析結果が返ってきませんでした。"
        );

      }


      /*
       * 保存用データ
       */

      currentAnalysis = {

        text:
          text,

        frontImg:
          document.getElementById(
            "prevFront"
          ).src,

        backImg:
          backFile
            ? document.getElementById(
                "prevBack"
              ).src
            : "",

        createdAt:
          new Date().toISOString(),

        model:
          result.model

      };


      /*
       * 結果表示
       */

      const resultDiv =
        document.getElementById(
          "result"
        );


      resultDiv.innerText =
        text;


      resultDiv.style.display =
        "block";


      /*
       * 結果カード表示
       */

      document.getElementById(
        "resultCard"
      ).style.display =
        "block";


      /*
       * 結果位置へスクロール
       */

      setTimeout(
        function () {

          document.getElementById(
            "resultCard"
          ).scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

        },
        100
      );


    } catch (error) {


      console.error(
        "Gemini Error:",
        error
      );


      showError(
        "解析に失敗しました。\n\n" +
        error.message +
        "\n\n" +
        "時間をおいてもう一度お試しください。"
      );


    } finally {


      btn.disabled =
        false;


      btn.innerText =
        "AIで判定 & 相場分析";


      document.getElementById(
        "status"
      ).style.display =
        "none";

    }

  }


  /*
   ============================================================
   MIMEタイプ
   ============================================================
  */

  function getMimeType(
    file
  ) {

    if (
      file.type &&
      file.type.startsWith(
        "image/"
      )
    ) {

      return file.type;

    }


    const name =
      file.name.toLowerCase();


    if (
      name.endsWith(".jpg") ||
      name.endsWith(".jpeg")
    ) {

      return "image/jpeg";

    }


    if (
      name.endsWith(".png")
    ) {

      return "image/png";

    }


    if (
      name.endsWith(".webp")
    ) {

      return "image/webp";

    }


    if (
      name.endsWith(".heic")
    ) {

      return "image/heic";

    }


    if (
      name.endsWith(".heif")
    ) {

      return "image/heif";

    }


    return "image/jpeg";

  }


  /*
   ============================================================
   AIプロンプト
   ============================================================
  */

  function getPrompt() {

    return `あなたは日本のシール・トレーディングカード専門の鑑定士です。

提供された画像を詳しく確認してください。

1枚目は表面画像です。
2枚目がある場合は裏面画像です。

画像から確認できる情報だけを使用してください。
分からない情報を推測して断定しないでください。

特に、
ビックリマンシール、
食玩シール、
ドラゴンボールカード、
トレーディングカード、
その他のコレクターズアイテム
について可能な限り具体的に判定してください。

以下の形式で回答してください。


【1. タイトル】

商品名・カード名・シール名など。

正式名称が画像から特定できる場合は正式名称を書いてください。

特定できない場合は、

「特定できません」

としてください。

候補がある場合は候補を2～3個まで示してください。


【2. 種別・シリーズ】

シリーズ名、商品カテゴリー、弾数など。

例：

旧ビックリマン
ビックリマンチョコ
食玩シール

  /*
   ============================================================
   コレクション保存
   ============================================================
  */

  function saveToCollection() {


    if (!currentAnalysis) {

      alert(
        "保存できる解析結果がありません。"
      );

      return;

    }


    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    list.unshift(
      currentAnalysis
    );


    localStorage.setItem(
      "my_collection",
      JSON.stringify(
        list
      )
    );


    renderCollection();


    alert(
      "コレクションに保存しました！"
    );

  }


  /*
   ============================================================
   タイトル取得
   ============================================================
  */

  function getCollectionTitle(
    text
  ) {


    if (!text) {

      return "不明なアイテム";

    }


    const match =
      text.match(
        /【1\.\s*タイトル】\s*[\r\n]+([^\r\n]+)/
      );


    if (
      match &&
      match[1]
    ) {

      return match[1].trim();

    }


    return "不明なアイテム";

  }


  /*
   ============================================================
   コレクション表示
   ============================================================
  */

  function renderCollection() {


    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    const container =
      document.getElementById(
        "collectionList"
      );


    if (
      list.length === 0
    ) {

      container.innerHTML =
        '<div class="empty">' +
        "保存されたアイテムはありません" +
        "</div>";

      return;

    }


    container.innerHTML =
      "";


    list.forEach(
      function (item) {


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "collection-item";


        /*
         * 画像
         */

        const img =
          document.createElement(
            "img"
          );


        img.src =
          item.frontImg || "";


        img.alt =
          "コレクション画像";


        /*
         * 情報
         */

        const info =
          document.createElement(
            "div"
          );


        info.className =
          "collection-info";


        /*
         * タイトル
         */

        const titleDiv =
          document.createElement(
            "div"
          );


        titleDiv.className =
          "collection-title";


        titleDiv.innerText =
          getCollectionTitle(
            item.text
          );


        /*
         * 日付
         */

        const dateDiv =
          document.createElement(
            "div"
          );


        dateDiv.className =
          "collection-date";


        if (
          item.createdAt
        ) {

          const date =
            new Date(
              item.createdAt
            );


          dateDiv.innerText =
            date.toLocaleString(
              "ja-JP"
            );

        }


        /*
         * 追加
         */

        info.appendChild(
          titleDiv
        );


        info.appendChild(
          dateDiv
        );


        div.appendChild(
          img
        );


        div.appendChild(
          info
        );


        container.appendChild(
          div
        );

      }
    );

  }


  /*
   ============================================================
   コレクション全削除
   ============================================================
  */

  function clearCollection() {


    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    if (
      list.length === 0
    ) {

      alert(
        "削除するコレクションがありません。"
      );

      return;

    }


    const confirmed =
      confirm(
        "保存されているコレクションをすべて削除しますか？"
      );


    if (!confirmed) {

      return;

    }


    localStorage.removeItem(
      "my_collection"
    );


    renderCollection();


    alert(
      "コレクションを削除しました。"
    );

  }

</script>
