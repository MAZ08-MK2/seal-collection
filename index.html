<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>コレクトAI v8.3</title>

  <style>
    :root {
      --primary: #007AFF;
      --bg: #f2f2f7;
      --card: #ffffff;
      --text: #1c1c1e;
      --subtext: #6c6c70;
      --border: #c6c6c8;
      --success: #34c759;
      --danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 16px;
      color: var(--text);
    }

    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin: 8px 0 4px;
    }

    .ver-badge {
      text-align: center;
      font-size: 0.8rem;
      color: var(--success);
      font-weight: bold;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--subtext);
      display: block;
      margin-bottom: 6px;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      background: #fff;
    }

    .key-hint {
      font-size: 0.75rem;
      color: #8e8e93;
      line-height: 1.4;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .upload-box {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      background: #fafafa;
      position: relative;
      cursor: pointer;
      min-height: 145px;
    }

    .upload-box:active {
      background: #eeeeee;
    }

    .upload-box span {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #555;
    }

    .upload-box input {
      display: none;
    }

    .upload-box img {
      width: 100%;
      height: 100px;
      object-fit: contain;
      display: none;
      margin-top: 8px;
      border-radius: 4px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn:disabled {
      background: #a2a2a7;
      cursor: not-allowed;
    }

    .save-btn {
      background: var(--success);
      margin-top: 12px;
    }

    .clear-btn {
      background: var(--danger);
      margin-top: 10px;
      padding: 10px;
      font-size: 0.85rem;
    }

    #result {
      display: none;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.6;
      background: #eef6ff;
      border-left: 4px solid var(--primary);
      padding: 12px;
      border-radius: 4px;
      word-break: break-word;
    }

    .error-box {
      display: none;
      white-space: pre-wrap;
      font-size: 0.85rem;
      line-height: 1.5;
      background: #fff2f2;
      border-left: 4px solid var(--danger);
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
      color: #8b0000;
    }

    .collection-item {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e5e5ea;
      padding: 10px 0;
    }

    .collection-item:last-child {
      border-bottom: none;
    }

    .collection-item img {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #f2f2f7;
    }

    .collection-info {
      flex: 1;
      min-width: 0;
    }

    .collection-title {
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1.4;
      word-break: break-word;
    }

    .collection-date {
      font-size: 0.7rem;
      color: #8e8e93;
      margin-top: 4px;
    }

    .empty {
      color: #8e8e93;
      font-size: 0.85rem;
      text-align: center;
      padding: 15px 0;
    }

    .status {
      display: none;
      text-align: center;
      font-size: 0.8rem;
      color: #6c6c70;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 14px;
      }

      .upload-grid {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <h1>✨ コレクションAIスキャン</h1>
  <div class="ver-badge">
    App Version: 8.3.1
  </div>

  <!-- APIキー -->
  <div class="card">

    <label for="apiKey">
      Gemini API Key
    </label>

    <input
      type="password"
      id="apiKey"
      placeholder="Gemini APIキーを貼り付け"
      autocomplete="off"
    >

    <div class="key-hint">
      ※APIキーはこのブラウザのlocalStorageに保存されます。
      他人と共有しないでください。
    </div>

  </div>


  <!-- 画像選択 -->
  <div class="card">

    <div class="upload-grid">

      <!-- 表面 -->
      <div
        class="upload-box"
        onclick="document.getElementById('imgFront').click()"
      >

        <span>🖼 表面の画像</span>

        <input
          type="file"
          id="imgFront"
          accept="image/jpeg,image/png,image/webp,image/heic"
          onchange="previewImage(this, 'prevFront')"
        >

        <img id="prevFront" alt="表面プレビュー">

      </div>


      <!-- 裏面 -->
      <div
        class="upload-box"
        onclick="document.getElementById('imgBack').click()"
      >

        <span>🖼 裏面の画像</span>

        <input
          type="file"
          id="imgBack"
          accept="image/jpeg,image/png,image/webp,image/heic"
          onchange="previewImage(this, 'prevBack')"
        >

        <img id="prevBack" alt="裏面プレビュー">

      </div>

    </div>


    <button
      class="btn"
      id="scanBtn"
      onclick="analyzeImages()"
    >
      AIで判定 & 相場分析
    </button>

    <div
      class="status"
      id="status"
    >
      AIが画像を解析しています...
    </div>

    <div
      class="error-box"
      id="errorBox"
    ></div>

  </div>


  <!-- 解析結果 -->
  <div
    class="card"
    id="resultCard"
    style="display:none;"
  >

    <label>
      解析結果
    </label>

    <div id="result"></div>

    <button
      class="btn save-btn"
      onclick="saveToCollection()"
    >
      💾 コレクションに保存
    </button>

  </div>


  <!-- コレクション -->
  <div class="card">

    <label>
      マイコレクション
    </label>

    <div id="collectionList"></div>

    <button
      class="btn clear-btn"
      onclick="clearCollection()"
    >
      コレクションをすべて削除
    </button>

  </div>


<script>

  /*
   * ============================================================
   * コレクトAI v8.3.1
   * Gemini 3.6 Flash
   * ============================================================
   */

  const MODEL_NAME = "gemini-3.6-flash";

  const API_BASE_URL =
    "https://generativelanguage.googleapis.com/v1beta/models/";

  let currentAnalysis = null;


  /*
   * ============================================================
   * 起動時
   * ============================================================
   */

  window.onload = function () {

    const savedKey =
      localStorage.getItem("gemini_api_key");

    if (savedKey) {

      document.getElementById("apiKey").value =
        savedKey;

    }

    renderCollection();

  };


  /*
   * ============================================================
   * APIキー保存
   * ============================================================
   */

  function saveApiKey(value) {

    const key = value.trim();

    if (key) {

      localStorage.setItem(
        "gemini_api_key",
        key
      );

    }

  }


  /*
   * ============================================================
   * 画像プレビュー
   * ============================================================
   */

  function previewImage(input, previewId) {

    if (!input.files || !input.files[0]) {
      return;
    }

    const file = input.files[0];

    const reader = new FileReader();

    reader.onload = function (event) {

      const img =
        document.getElementById(previewId);

      img.src = event.target.result;

      img.style.display = "block";

    };

    reader.readAsDataURL(file);

  }


  /*
   * ============================================================
   * File → Base64
   * ============================================================
   */

  function fileToBase64(file) {

    return new Promise(function (resolve, reject) {

      const reader = new FileReader();

      reader.onload = function () {

        const result = reader.result;

        const base64 =
          result.split(",")[1];

        resolve(base64);

      };

      reader.onerror = function (error) {

        reject(error);

      };

      reader.readAsDataURL(file);

    });

  }


  /*
   * ============================================================
   * エラー表示
   * ============================================================
   */

  function showError(message) {

    const errorBox =
      document.getElementById("errorBox");

    errorBox.innerText = message;

    errorBox.style.display = "block";

  }


  function hideError() {

    const errorBox =
      document.getElementById("errorBox");

    errorBox.innerText = "";

    errorBox.style.display = "none";

  }


  /*
   * ============================================================
   * AI解析
   * ============================================================
   */

  async function analyzeImages() {

    hideError();

    const apiKey =
      document.getElementById("apiKey").value.trim();

    const frontFile =
      document.getElementById("imgFront").files[0];

    const backFile =
      document.getElementById("imgBack").files[0];


    /*
     * APIキー確認
     */

    if (!apiKey) {

      alert(
        "Gemini APIキーを入力してください。"
      );

      return;

    }


    /*
     * 表面画像確認
     */

    if (!frontFile) {

      alert(
        "表面の画像を選択してください。"
      );

      return;

    }


    /*
     * APIキー保存
     */

    saveApiKey(apiKey);


    /*
     * ボタン状態変更
     */

    const btn =
      document.getElementById("scanBtn");

    const status =
      document.getElementById("status");

    btn.disabled = true;

    btn.innerText =
      "AI解析中...";

    status.style.display =
      "block";


    try {

      /*
       * 表面画像
       */

      const frontBase64 =
        await fileToBase64(frontFile);


      /*
       * Geminiに送るparts
       */

      const parts = [];


      /*
       * 解析指示
       */

      parts.push({
        text: getPrompt()
      });


      /*
       * 表面画像
       */

      parts.push({
        inline_data: {
          mime_type: frontFile.type,
          data: frontBase64
        }
      });


      /*
       * 裏面画像がある場合
       */

      if (backFile) {

        const backBase64 =
          await fileToBase64(backFile);

        parts.push({
          inline_data: {
            mime_type: backFile.type,
            data: backBase64
          }
        });

      }


      /*
       * Gemini API URL
       */

      const url =
        API_BASE_URL +
        MODEL_NAME +
        ":generateContent";


      /*
       * APIリクエスト
       */

      const response =
        await fetch(url, {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "x-goog-api-key":
              apiKey

          },

          body: JSON.stringify({

            contents: [
              {
                parts: parts
              }
            ]

          })

        });


      /*
       * JSON取得
       */

      const data =
        await response.json();


      /*
       * HTTPエラー
       */

      if (!response.ok) {

        const errorMessage =
          data &&
          data.error &&
          data.error.message
            ? data.error.message
            : "Gemini APIでエラーが発生しました。";

        throw new Error(
          "APIエラー (" +
          response.status +
          ")\n\n" +
          errorMessage
        );

      }


      /*
       * candidates確認
       */

      if (
        !data.candidates ||
        !data.candidates.length
      ) {

        throw new Error(
          "AIから解析結果が返ってきませんでした。"
        );

      }


      /*
       * テキスト抽出
       */

      let text = "";

      const responseParts =
        data.candidates[0].content &&
        data.candidates[0].content.parts;


      if (responseParts) {

        responseParts.forEach(function (part) {

          if (part.text) {

            text += part.text;

          }

        });

      }


      /*
       * テキストが空
       */

      if (!text.trim()) {

        throw new Error(
          "AIの解析結果が空でした。"
        );

      }


      /*
       * 現在の解析結果を保存
       */

      currentAnalysis = {

        text: text,

        frontImg:
          document.getElementById(
            "prevFront"
          ).src,

        createdAt:
          new Date().toISOString()

      };


      /*
       * 結果表示
       */

      const resultDiv =
        document.getElementById("result");

      resultDiv.innerText =
        text;

      resultDiv.style.display =
        "block";


      /*
       * 結果カード表示
       */

      document.getElementById(
        "resultCard"
      ).style.display =
        "block";


    } catch (error) {

      console.error(error);

      showError(
        "解析に失敗しました。\n\n" +
        error.message
      );

    } finally {

      btn.disabled = false;

      btn.innerText =
        "AIで判定 & 相場分析";

      status.style.display =
        "none";

    }

  }


  /*
   * ============================================================
   * AIへの指示
   * ============================================================
   */

  function getPrompt() {

    return `
あなたは日本のシール・トレーディングカード専門の鑑定士です。

提供された画像を詳しく確認してください。

1枚目は表面画像です。
2枚目がある場合は裏面画像です。

画像から確認できる情報だけを使用してください。
不明な情報を推測して断定しないでください。

特にビックリマンシール、食玩シール、トレーディングカードなどについて、
可能な限り具体的に判定してください。

以下の形式で回答してください。

【1. タイトル】
正式名称が分かる場合は正式名称。
分からない場合は候補を示し、「特定できません」と明記してください。

【2. 種別・シリーズ】
例：
旧ビックリマン
チョコ版
アイス版
食玩シール
トレーディングカード
など。

【3. 裏面・素材の特徴】
裏面の色、印刷、素材、ホログラム、透け方など、
画像から確認できる特徴を記載してください。

【4. 推定コンディション】
以下を目安にしてください。

S：非常に良好
A：良好
B：一般的な中古状態
C：傷・汚れが目立つ
D：大きなダメージあり

ただし画像だけで判断できない部分は
「画像では確認できません」としてください。

【5. 参考相場価格帯】
現在の一般的な中古市場での参考価格帯を示してください。

ただし、リアルタイムの市場価格を直接確認できない場合は、
「画像だけでは正確な相場を確認できません」
と明記してください。

価格を断定しないでください。

【6. 鑑定ポイント】
この商品の価値を左右するポイントを説明してください。

特に、

・初期版
・後期版
・復刻版
・アイス版
・チョコ版
・印刷違い
・裏面違い
・素材違い
・エラー版
・状態
・希少性

など、画像から判断できるものがあれば説明してください。

【7. 判定の確信度】

高：画像からほぼ確実に判断できる
中：候補をかなり絞れる
低：画像だけでは特定が難しい

の3段階で判定してください。

重要：
画像だけで分からない情報を作らないでください。
特に価格・年代・版違いについては断定しないでください。
`;
  }


  /*
   * ============================================================
   * コレクション保存
   * ============================================================
   */

  function saveToCollection() {

    if (!currentAnalysis) {

      alert(
        "保存できる解析結果がありません。"
      );

      return;

    }


    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    list.unshift(
      currentAnalysis
    );


    localStorage.setItem(
      "my_collection",
      JSON.stringify(list)
    );


    renderCollection();


    alert(
      "コレクションに保存しました！"
    );

  }


  /*
   * ============================================================
   * コレクション表示
   * ============================================================
   */

  function renderCollection() {

    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    const container =
      document.getElementById(
        "collectionList"
      );


    if (list.length === 0) {

      container.innerHTML =
        '<div class="empty">' +
        "保存されたアイテムはありません" +
        "</div>";

      return;

    }


    container.innerHTML = "";


    list.forEach(function (item) {

      const div =
        document.createElement("div");

      div.className =
        "collection-item";


      /*
       * タイトル取得
       */

      let title =
        "不明なアイテム";


      if (item.text) {

        const lines =
          item.text.split("\n");

        for (let i = 0; i < lines.length; i++) {

          const line =
            lines[i].trim();

          if (
            line &&
            !line.startsWith("【")
          ) {

            title = line;

            break;

          }

        }

        /*
         * 【1. タイトル】の行から取得
         */

        const titleMatch =
          item.text.match(
            /【1\.\s*タイトル】\s*[\r\n]+([^\r\n]+)/
          );

        if (
          titleMatch &&
          titleMatch[1]
        ) {

          title =
            titleMatch[1].trim();

        }

      }


      /*
       * 画像
       */

      const img =
        document.createElement("img");

      img.src =
        item.frontImg || "";

      img.alt =
        title;


      /*
       * 情報
       */

      const info =
        document.createElement("div");

      info.className =
        "collection-info";


      const titleDiv =
        document.createElement("div");

      titleDiv.className =
        "collection-title";

      titleDiv.innerText =
        title;


      const dateDiv =
        document.createElement("div");

      dateDiv.className =
        "collection-date";


      if (item.createdAt) {

        const date =
          new Date(item.createdAt);

        dateDiv.innerText =
          date.toLocaleString(
            "ja-JP"
          );

      }


      info.appendChild(
        titleDiv
      );

      info.appendChild(
        dateDiv
      );


      div.appendChild(
        img
      );

      div.appendChild(
        info
      );


      container.appendChild(
        div
      );

    });

  }


  /*
   * ============================================================
   * コレクション全削除
   * ============================================================
   */

  function clearCollection() {

    const list =
      JSON.parse(
        localStorage.getItem(
          "my_collection"
        ) || "[]"
      );


    if (list.length === 0) {

      alert(
        "削除するコレクションがありません。"
      );

      return;

    }


    const confirmed =
      confirm(
        "保存されているコレクションをすべて削除しますか？"
      );


    if (!confirmed) {

      return;

    }


    localStorage.removeItem(
      "my_collection"
    );


    renderCollection();


    alert(
      "コレクションを削除しました。"
    );

  }

</script>

</body>
</html>
