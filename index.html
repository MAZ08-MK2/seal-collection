<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シールコレクション AI</title>

  <style>
    :root{
      --blue:#1677ff;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#ea580c;
      --bg:#f5f7fb;
      --line:#dde3ee;
      --text:#172033;
      --sub:#667085;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
    }

    main{
      max-width:680px;
      margin:auto;
      padding:20px 14px 42px;
    }

    h1{
      font-size:23px;
      text-align:center;
      margin:8px 0 4px;
    }

    .lead{
      text-align:center;
      color:var(--sub);
      font-size:13px;
      margin:0 0 18px;
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 2px 10px #16213a0a;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }

    .muted,
    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.5;
    }

    .hint{
      margin-top:7px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:0 0 6px;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px;
      font:inherit;
      background:#fff;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .photo{
      border:2px dashed #b8c3d6;
      border-radius:13px;
      min-height:160px;
      padding:10px;
      text-align:center;
      cursor:pointer;
      color:var(--sub);
      font-size:13px;
    }

    .photo img{
      width:100%;
      height:118px;
      object-fit:contain;
      display:none;
      margin-top:8px;
      border-radius:8px;
    }

    .photo input{
      display:none;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 14px;
      background:var(--blue);
      color:#fff;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn.secondary{
      background:#eef4ff;
      color:#125dc9;
    }

    .btn.green{
      background:var(--green);
    }

    .btn.red{
      background:var(--red);
    }

    .btn.orange{
      background:var(--orange);
    }

    .btn.small{
      padding:8px 10px;
      font-size:12px;
      width:auto;
    }

    .full{
      width:100%;
      margin-top:12px;
    }

    .status,
    .error,
    .warning{
      margin-top:11px;
      padding:10px;
      border-radius:9px;
      font-size:13px;
      white-space:pre-wrap;
      line-height:1.5;
    }

    .status{
      display:none;
      background:#eff6ff;
      color:#1957a7;
    }

    .error{
      display:none;
      background:#fff1f2;
      color:#a9162b;
    }

    .warning{
      display:none;
      background:#fff7ed;
      color:#9a3412;
    }

    .result{
      display:none;
    }

    .fields{
      display:grid;
      gap:10px;
    }

    .item{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
    }

    .item:last-child{
      border:0;
    }

    .thumb{
      width:64px;
      height:64px;
      object-fit:cover;
      border-radius:10px;
      background:#edf1f7;
      flex:none;
    }

    .item h3{
      font-size:15px;
      margin:0 0 3px;
    }

    .item p{
      font-size:12px;
      color:var(--sub);
      margin:2px 0;
    }

    .item .grow{
      flex:1;
      min-width:0;
    }

    .badge{
      font-size:12px;
      color:#17643b;
      background:#e9f9ef;
      padding:5px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .priceBox{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-top:4px;
    }

    .priceRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:5px 0;
      font-size:13px;
    }

    .priceRow strong{
      font-size:14px;
    }

    .source{
      font-size:11px;
      color:var(--sub);
      margin-top:8px;
      line-height:1.5;
    }

    .hidden{
      display:none !important;
    }

    code{
      background:#f1f5f9;
      padding:2px 4px;
      border-radius:4px;
    }

    @media(max-width:390px){
      .grid{
        gap:7px;
      }

      .photo{
        min-height:140px;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>✨ シールコレクション AI</h1>

  <p class="lead">
    表面・裏面を撮影して、AIで判定・相場確認・pCloud保存
  </p>

  <!-- =========================
       pCloud
  ========================== -->

  <section class="card">

    <div class="row">
      <strong>pCloud 保存先</strong>
      <span id="cloudState" class="badge">未接続</span>
    </div>

    <p class="hint">
      pCloud承認後に <code>PCLOUD_CLIENT_ID</code> を入力してください。<br>
      Client Secret は入力しません。
    </p>

    <button
      id="loginBtn"
      class="btn secondary full"
      type="button">
      pCloud に接続
    </button>

    <button
      id="logoutBtn"
      class="btn small hidden"
      type="button">
      接続を解除
    </button>

  </section>


  <!-- =========================
       Gemini API
  ========================== -->

  <section class="card">

    <label for="apiKey">
      Gemini API Key
    </label>

    <input
      id="apiKey"
      type="password"
      autocomplete="off"
      placeholder="Gemini APIキーを貼り付け">

    <p class="hint">
      APIキーはこの端末・このブラウザのlocalStorageに保存します。
    </p>

  </section>


  <!-- =========================
       画像
  ========================== -->

  <section class="card">

    <div class="grid">

      <label class="photo">

        🖼 表面の画像

        <input
          id="front"
          type="file"
          accept="image/*">

        <img
          id="frontPreview"
          alt="表面のプレビュー">

      </label>


      <label class="photo">

        🖼 裏面の画像（任意）

        <input
          id="back"
          type="file"
          accept="image/*">

        <img
          id="backPreview"
          alt="裏面のプレビュー">

      </label>

    </div>


    <button
      id="scanBtn"
      class="btn full"
      type="button">
      🔎 AIで判定する
    </button>


    <div
      id="status"
      class="status">
    </div>


    <div
      id="warning"
      class="warning">
    </div>


    <div
      id="error"
      class="error">
    </div>

  </section>


  <!-- =========================
       AI結果
  ========================== -->

  <section
    id="resultCard"
    class="card result">

    <label>
      解析結果（必要なら修正してください）
    </label>


    <div class="fields">

      <div>
        <label>シール名</label>
        <input id="name">
      </div>


      <div>
        <label>シリーズ・作品名</label>
        <input id="series">
      </div>


      <div>
        <label>種類</label>

        <select id="kind">
          <option>シール</option>
          <option>トレカ</option>
          <option>食玩</option>
        </select>

      </div>


      <div>
        <label>レア度ランク</label>

        <select id="rarity">
          <option>N</option>
          <option>R</option>
          <option>SR</option>
          <option>SSR</option>
          <option>SC</option>
          <option>UR</option>
          <option>SEC</option>
          <option>PR</option>
          <option>不明</option>
        </select>

      </div>


      <div>
        <label>価格</label>
        <input id="price">
      </div>


      <!-- 相場情報 -->

      <div class="priceBox">

        <strong>📊 相場情報</strong>

        <div class="priceRow">
          <span>メルカリ</span>
          <strong id="mercariPrice">確認中</strong>
        </div>

        <div class="priceRow">
          <span>まんだらけ</span>
          <strong id="mandarakePrice">確認中</strong>
        </div>

        <div class="priceRow">
          <span>総合推定</span>
          <strong id="marketPrice">確認中</strong>
        </div>

        <div
          id="sourceInfo"
          class="source">
        </div>

      </div>


      <div>
        <label>メモ</label>
        <textarea id="memo"></textarea>
      </div>

    </div>


    <button
      id="saveBtn"
      class="btn green full"
      type="button">
      💾 pCloudに保存
    </button>

  </section>


  <!-- =========================
       コレクション
  ========================== -->

  <section class="card">

    <div class="row">

      <label style="margin:0">
        マイコレクション
      </label>

      <button
        id="refreshBtn"
        class="btn small secondary"
        type="button">
        一覧を更新
      </button>

    </div>


    <div id="list">

      <p class="muted">
        pCloudに接続すると保存済みの一覧を読み込みます。
      </p>

    </div>

  </section>

</main>


<script>

/* =========================================================
   設定
========================================================= */

/*
  pCloud My Apps の Client ID を入力
*/
const PCLOUD_CLIENT_ID =
  'PASTE_YOUR_PCLOUD_CLIENT_ID_HERE';


/*
  Geminiモデル

  安定版のGemini 2.5 Flashを使用。
*/
const GEMINI_MODEL =
  'gemini-2.5-flash';


/*
  pCloudの保存フォルダ
*/
const ROOT_FOLDER =
  'シールコレクション';


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


const store =
  localStorage;


let analysis =
  null;


let records =
  [];


/* =========================================================
   メッセージ
========================================================= */

function setStatus(text){

  $('status').textContent =
    text;

  $('status').style.display =
    text ? 'block' : 'none';
}


function setWarning(text){

  $('warning').textContent =
    text;

  $('warning').style.display =
    text ? 'block' : 'none';
}


function fail(error){

  console.error(error);

  setStatus('');

  setWarning('');

  let message =
    error?.message ||
    String(error);


  /*
    Gemini Quotaエラーを分かりやすくする
  */

  if(
    /quota/i.test(message) ||
    /rate limit/i.test(message) ||
    /429/.test(message) ||
    /exceeded/i.test(message)
  ){

    message =
      'Gemini APIの利用上限に達しています。\n\n' +
      'Google AI Studioの使用量・Rate Limitを確認してください。\n\n' +
      'コードの入力ミスではなく、Gemini API側のQuota（利用枠）の問題です。';
  }


  $('error').textContent =
    message;

  $('error').style.display =
    'block';
}


function clearMessage(){

  $('error').style.display =
    'none';

  setWarning('');

  setStatus('');
}


/* =========================================================
   HTMLエスケープ
========================================================= */

function esc(text){

  return String(text ?? '')
    .replace(/[&<>"']/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c]));

}


/* =========================================================
   ID
========================================================= */

function uid(){

  return Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,8);

}


/* =========================================================
   MIME
========================================================= */

function mime(file){

  return file.type ||
    'image/jpeg';

}


/* =========================================================
   プレビュー
========================================================= */

function preview(input,image){

  const file =
    input.files[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      image.src =
        reader.result;

      image.style.display =
        'block';

    };


  reader.readAsDataURL(file);

}


$('front').onchange =
  () =>
    preview(
      $('front'),
      $('frontPreview')
    );


$('back').onchange =
  () =>
    preview(
      $('back'),
      $('backPreview')
    );


/* =========================================================
   API Key
========================================================= */

function saveKey(){

  store.setItem(
    'stickerGeminiKey',
    $('apiKey').value.trim()
  );

}


/* =========================================================
   pCloud
========================================================= */

function apiHost(){

  return store.getItem(
    'pcloudHost'
  ) || 'api.pcloud.com';

}


function token(){

  return store.getItem(
    'pcloudToken'
  );

}


function updateCloud(){

  const connected =
    !!token();


  $('cloudState').textContent =
    connected
      ? '接続済み'
      : '未接続';


  $('loginBtn')
    .classList
    .toggle(
      'hidden',
      connected
    );


  $('logoutBtn')
    .classList
    .toggle(
      'hidden',
      !connected
    );

}


function redirectURI(){

  return location.href
    .split('#')[0];

}


/* =========================================================
   pCloud OAuth
========================================================= */

function connect(){

  if(
    PCLOUD_CLIENT_ID.includes('PASTE_')
  ){

    throw Error(
      'PCLOUD_CLIENT_ID にpCloudのClient IDを入力してください。'
    );

  }


  if(
    location.protocol === 'file:'
  ){

    throw Error(
      'このHTMLはHTTPSで公開してから使用してください。'
    );

  }


  const state =
    uid();


  store.setItem(
    'pcloudState',
    state
  );


  const params =
    new URLSearchParams({

      client_id:
        PCLOUD_CLIENT_ID,

      response_type:
        'token',

      redirect_uri:
        redirectURI(),

      state:
        state

    });


  location.href =
    'https://my.pcloud.com/oauth2/authorize?' +
    params.toString();

}


/* =========================================================
   OAuth戻り
========================================================= */

function readOAuth(){

  if(!location.hash){
    return;
  }


  const params =
    new URLSearchParams(
      location.hash.slice(1)
    );


  if(
    params.get('access_token')
  ){

    if(
      params.get('state') !==
      store.getItem('pcloudState')
    ){

      throw Error(
        'pCloud認証の確認値が一致しません。'
      );

    }


    store.setItem(
      'pcloudToken',
      params.get('access_token')
    );


    store.setItem(
      'pcloudHost',
      params.get('hostname') ||
      'api.pcloud.com'
    );


    history.replaceState(
      null,
      '',
      redirectURI()
    );

  }
  else if(
    params.get('error')
  ){

    throw Error(
      'pCloud認証が完了しませんでした: ' +
      params.get('error')
    );

  }

}


/* =========================================================
   pCloud API
========================================================= */

async function pcall(
  method,
  params = {},
  form = null
){

  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const url =
    'https://' +
    apiHost() +
    '/' +
    method;


  let options;


  if(form){

    form.append(
      'access_token',
      token()
    );


    options = {

      method:'POST',

      body:form

    };

  }
  else{

    options = {

      method:'POST',

      headers:{
        'Content-Type':
          'application/x-www-form-urlencoded'
      },

      body:
        new URLSearchParams({
          ...params,
          access_token:
            token()
        })

    };

  }


  let response;


  try{

    response =
      await fetch(
        url,
        options
      );

  }
  catch{

    throw Error(
      'pCloudへ接続できませんでした。'
    );

  }


  let data;


  try{

    data =
      await response.json();

  }
  catch{

    throw Error(
      'pCloudから正しい応答が返りませんでした。'
    );

  }


  if(
    !response.ok ||
    data.result !== 0
  ){

    throw Error(
      'pCloudエラー: ' +
      (
        data.error ||
        data.result ||
        response.status
      )
    );

  }


  return data;

}


/* =========================================================
   pCloudルートフォルダ
========================================================= */

async function root(){

  const data =
    await pcall(
      'createfolderifnotexists',
      {
        folderid:0,
        name:ROOT_FOLDER
      }
    );


  return data.metadata.folderid;

}


/* =========================================================
   pCloudアップロード
========================================================= */

async function upload(
  folderid,
  file,
  filename
){

  const form =
    new FormData();


  form.append(
    'folderid',
    folderid
  );


  form.append(
    'nopartial',
    '1'
  );


  form.append(
    'renameifexists',
    '0'
  );


  form.append(
    'file',
    file,
    filename
  );


  return pcall(
    'uploadfile',
    {},
    form
  );

}


/* =========================================================
   Geminiプロンプト
========================================================= */

function buildPrompt(){

  return `
あなたは日本のコレクション品を判定する専門アシスタントです。

添付された画像の表面・裏面を確認してください。

画像から確認できる情報を優先してください。

以下のJSONだけを返してください。
Markdown、説明文、コードブロックは不要です。

{
  "name": "",
  "series": "",
  "kind": "シール",
  "rarity": "不明",
  "memo": ""
}

ルール:

kindは必ず次のいずれか:
「シール」
「トレカ」
「食玩」

rarityは必ず次のいずれか:
「N」
「R」
「SR」
「SSR」
「SC」
「UR」
「SEC」
「PR」
「不明」

画像だけではレア度を確認できない場合は「不明」にしてください。

商品名が確実に判定できない場合は無理に推測せず、
「確認できません」
としてください。

シリーズ名も確認できない場合は
「確認できません」
としてください。

memoには、
・画像から確認できた特徴
・裏面情報
・レア度を判断した根拠
などを簡潔に記載してください。

重要:
確認できない情報を架空に作らないでください。
`.trim();

}


/* =========================================================
   Base64
========================================================= */

async function b64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            String(
              reader.result
            ).split(',')[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   JSON解析
========================================================= */

function jsonFromText(text){

  let clean =
    String(text || '')
      .trim();


  clean =
    clean
      .replace(/^```json\s*/i,'')
      .replace(/^```\s*/i,'')
      .replace(/\s*```$/i,'')
      .trim();


  /*
    JSON部分だけ抽出
  */

  const start =
    clean.indexOf('{');


  const end =
    clean.lastIndexOf('}');


  if(
    start >= 0 &&
    end > start
  ){

    clean =
      clean.slice(
        start,
        end + 1
      );

  }


  return JSON.parse(clean);

}


/* =========================================================
   Gemini AI判定
========================================================= */

async function scan(){

  clearMessage();


  const key =
    $('apiKey')
      .value
      .trim();


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!key){

    throw Error(
      'Gemini API Keyを入力してください。'
    );

  }


  if(!front){

    throw Error(
      '表面の画像を選択してください。'
    );

  }


  saveKey();


  $('scanBtn').disabled =
    true;


  try{

    setStatus(
      '画像をAIで解析しています…'
    );


    const parts = [

      {
        text:
          buildPrompt()
      },

      {
        inline_data:{
          mime_type:
            mime(front),

          data:
            await b64(front)
        }
      }

    ];


    if(back){

      parts.push({

        inline_data:{
          mime_type:
            mime(back),

          data:
            await b64(back)
        }

      });

    }


    /*
      ここではGoogle Searchを同時使用しない。

      まずAI画像判定を安定させる。
      相場検索は判定後に別処理で行う。
    */

    const body = {

      contents:[
        {
          role:'user',
          parts
        }
      ],

      generationConfig:{

        temperature:0.1,

        maxOutputTokens:500,

        responseMimeType:
          'application/json'

      }

    };


    const response =
      await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/' +
        encodeURIComponent(GEMINI_MODEL) +
        ':generateContent?key=' +
        encodeURIComponent(key),

        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(body)

        }
      );


    let data;


    try{

      data =
        await response.json();

    }
    catch{

      throw Error(
        'Geminiから正しいJSON応答が返りませんでした。'
      );

    }


    if(!response.ok){

      const message =
        data?.error?.message ||
        'HTTP ' +
        response.status;


      if(
        response.status === 429 ||
        /quota/i.test(message) ||
        /rate limit/i.test(message)
      ){

        throw Error(
          'Gemini APIの利用上限に達しました。\n\n' +
          'Google AI StudioのUsage / Rate Limitを確認してください。\n\n' +
          'APIキーやこのHTMLの入力ミスではありません。'
        );

      }


      throw Error(
        'Geminiエラー: ' +
        message
      );

    }


    const text =
      data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(
          part => part.text || ''
        )
        .join('') ||
        '';


    if(!text){

      throw Error(
        'Geminiから判定結果が返ってきませんでした。'
      );

    }


    analysis =
      jsonFromText(text);


    /*
      フォームへ反映
    */

    $('name').value =
      analysis.name || '';


    $('series').value =
      analysis.series || '';


    const kinds = [
      'シール',
      'トレカ',
      '食玩'
    ];


    $('kind').value =
      kinds.includes(
        analysis.kind
      )
        ? analysis.kind
        : 'シール';


    const rarities = [
      'N',
      'R',
      'SR',
      'SSR',
      'SC',
      'UR',
      'SEC',
      'PR',
      '不明'
    ];


    $('rarity').value =
      rarities.includes(
        analysis.rarity
      )
        ? analysis.rarity
        : '不明';


    $('memo').value =
      analysis.memo || '';


    $('price').value =
      '相場を検索してください';


    $('mercariPrice').textContent =
      '未検索';


    $('mandarakePrice').textContent =
      '未検索';


    $('marketPrice').textContent =
      '未検索';


    $('sourceInfo').textContent =
      '商品名を確認後、下の相場検索を実行してください。';


    $('resultCard').style.display =
      'block';


    setStatus(
      'AI判定が完了しました。内容を確認してください。'
    );


  }
  finally{

    $('scanBtn').disabled =
      false;

  }

}


/* =========================================================
   検索用商品名
========================================================= */

function searchName(){

  const name =
    $('name')
      .value
      .trim();


  const series =
    $('series')
      .value
      .trim();


  if(
    !name ||
    name === '確認できません'
  ){

    return '';

  }


  return (
    series &&
    series !== '確認できません'
      ? series + ' ' + name
      : name
  );

}


/* =========================================================
   Google検索URL生成
========================================================= */

function googleSearchUrl(query){

  return (
    'https://www.google.com/search?q=' +
    encodeURIComponent(query)
  );

}


/* =========================================================
   相場検索
========================================================= */

/*
  ブラウザからメルカリ・まんだらけのページを
  直接スクレイピングする方式にはしない。

  CORS・サイト仕様変更・利用規約等の問題があるため、
  Google検索ページを開いて確認できる構成にする。
*/

function marketSearch(){

  clearMessage();


  if(!analysis){

    throw Error(
      '先にAIで判定してください。'
    );

  }


  const query =
    searchName();


  if(!query){

    throw Error(
      '商品名を確認できないため、相場検索できません。'
    );

  }


  const mercariQuery =
    'site:jp.mercari.com ' +
    query;


  const mandarakeQuery =
    'site:mandarake.co.jp ' +
    query;


  /*
    Google検索を2つ開く
  */

  window.open(
    googleSearchUrl(
      mercariQuery
    ),
    '_blank'
  );


  window.open(
    googleSearchUrl(
      mandarakeQuery
    ),
    '_blank'
  );


  setWarning(
    'メルカリとまんだらけの検索結果を開きました。\n' +
    '表示された実際の販売価格を確認して、下の価格欄へ入力してください。\n\n' +
    '確認できない場合は「確認できません」としてください。'
  );

}


/* =========================================================
   保存データ
========================================================= */

function current(){

  return {

    id:
      uid(),

    name:
      $('name')
        .value
        .trim() ||
      '名称未設定',

    series:
      $('series')
        .value
        .trim(),

    kind:
      $('kind').value,

    rarity:
      $('rarity').value,

    price:
      $('price')
        .value
        .trim(),

    mercariPrice:
      $('mercariPrice')
        .textContent,

    mandarakePrice:
      $('mandarakePrice')
        .textContent,

    marketPrice:
      $('marketPrice')
        .textContent,

    memo:
      $('memo')
        .value
        .trim(),

    savedAt:
      new Date().toISOString()

  };

}


/* =========================================================
   保存
========================================================= */

async function save(){

  clearMessage();


  if(!analysis){

    throw Error(
      '先にAIで判定してください。'
    );

  }


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!front){

    throw Error(
      '表面の画像がありません。'
    );

  }


  $('saveBtn').disabled =
    true;


  try{

    setStatus(
      'pCloudに保存しています…'
    );


    const rootFolderId =
      await root();


    const item =
      current();


    const folder =
      await pcall(
        'createfolderifnotexists',
        {
          folderid:
            rootFolderId,

          name:
            'item-' +
            item.id
        }
      );


    const folderid =
      folder.metadata.folderid;


    function ext(file){

      return (
        file.name
          .split('.')
          .pop() ||
        'jpg'
      )
      .replace(
        /[^a-z0-9]/gi,
        ''
      )
      .toLowerCase();

    }


    /*
      表面
    */

    await upload(
      folderid,
      front,
      'front.' +
      ext(front)
    );


    /*
      裏面
    */

    if(back){

      await upload(
        folderid,
        back,
        'back.' +
        ext(back)
      );

    }


    /*
      data.json
    */

    item.folderid =
      folderid;


    const dataFile =
      new File(
        [
          JSON.stringify(
            item,
            null,
            2
          )
        ],

        'data.json',

        {
          type:
            'application/json'
        }
      );


    await upload(
      folderid,
      dataFile,
      'data.json'
    );


    /*
      一覧表示用
    */

    item.preview =
      $('frontPreview').src;


    records.unshift(
      item
    );


    render();


    setStatus(
      'pCloudに保存しました。'
    );


  }
  finally{

    $('saveBtn').disabled =
      false;

  }

}


/* =========================================================
   pCloud一覧
========================================================= */

async function refresh(){

  clearMessage();


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  setStatus(
    'pCloudの保存データを読み込んでいます…'
  );


  const rootFolderId =
    await root();


  const data =
    await pcall(
      'listfolder',
      {
        folderid:
          rootFolderId,

        recursive:
          0
      }
    );


  const folders =
    (
      data.metadata.contents ||
      []
    )
    .filter(
      item =>
        item.isfolder &&
        item.name.startsWith(
          'item-'
        )
    );


  records = [];


  /*
    各フォルダのdata.jsonを取得する。
    ここではファイル一覧だけ取得し、
    data.jsonをダウンロードする。
  */

  for(
    const folder of folders
  ){

    try{

      const files =
        await pcall(
          'listfolder',
          {
            folderid:
              folder.folderid,

            recursive:
              0
          }
        );


      const jsonFile =
        (
          files.metadata.contents ||
          []
        )
        .find(
          item =>
            !item.isfolder &&
            item.name ===
              'data.json'
        );


      if(jsonFile){

        const fileInfo =
          await pcall(
            'getfilelink',
            {
              fileid:
                jsonFile.fileid,

              forcedownload:
                1
            }
          );


        const link =
          fileInfo.link;


        const response =
          await fetch(
            link
          );


        const item =
          await response.json();


        item.folderid =
          folder.folderid;


        records.push(
          item
        );

      }
      else{

        records.push({

          id:
            folder.name.slice(5),

          folderid:
            folder.folderid,

          name:
            '保存済みアイテム',

          series:'',
          kind:'',
          rarity:'',
          price:'',
          memo:'',
          savedAt:
            folder.modified

        });

      }

    }
    catch(error){

      console.warn(
        'data.json読み込み失敗',
        error
      );


      records.push({

        id:
          folder.name.slice(5),

        folderid:
          folder.folderid,

        name:
          '保存済みアイテム',

        series:'',
        kind:'',
        rarity:'',
        price:'',
        memo:'',

        savedAt:
          folder.modified

      });

    }

  }


  records.sort(
    (a,b) =>
      new Date(
        b.savedAt || 0
      ) -
      new Date(
        a.savedAt || 0
      )
  );


  render();


  setStatus(
    records.length +
    '件読み込みました。'
  );

}


/* =========================================================
   削除
========================================================= */

async function del(id){

  const record =
    records.find(
      item =>
        item.id === id
    );


  if(!record){
    return;
  }


  if(
    !confirm(
      'このアイテムをpCloudから削除します。\nよろしいですか？'
    )
  ){

    return;

  }


  clearMessage();


  try{

    setStatus(
      'pCloudから削除しています…'
    );


    await pcall(
      'deletefolderrecursive',
      {
        folderid:
          record.folderid
      }
    );


    records =
      records.filter(
        item =>
          item.id !== id
      );


    render();


    setStatus(
      '削除しました。'
    );


  }
  catch(error){

    fail(error);

  }

}


/* =========================================================
   一覧表示
========================================================= */

function render(){

  if(!records.length){

    $('list').innerHTML =
      '<p class="muted">まだ保存されていません。</p>';

    return;

  }


  $('list').innerHTML =
    records
      .map(record => `

        <div class="item">

          <div class="grow">

            <h3>
              ${esc(record.name)}
            </h3>

            <p>
              ${esc(record.series)}
             　
              ${esc(record.kind)}
             　
              ${esc(record.rarity)}
            </p>

            <p>
              価格：
              ${esc(record.price)}
            </p>

            ${
              record.mercariPrice
                ? `
                  <p>
                    メルカリ：
                    ${esc(record.mercariPrice)}
                  </p>
                `
                : ''
            }

            ${
              record.mandarakePrice
                ? `
                  <p>
                    まんだらけ：
                    ${esc(record.mandarakePrice)}
                  </p>
                `
                : ''
            }

            <p>
              ${
                record.savedAt
                  ? new Date(
                      record.savedAt
                    )
                    .toLocaleDateString(
                      'ja-JP'
                    )
                  : ''
              }
            </p>

          </div>

          <button
            class="btn small red"
            onclick="del('${esc(record.id)}')">
            削除
          </button>

        </div>

      `)
      .join('');

}
