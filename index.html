<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>コレクトAI</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="コレクトAI">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192/007AFF/ffffff?text=COLLECT">
  
  <style>
    :root { --primary: #007AFF; --bg: #f2f2f7; --card: #ffffff; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 16px; color: #1c1c1e; }
    h1 { font-size: 1.3rem; text-align: center; margin-bottom: 16px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    label { font-size: 0.85rem; font-weight: bold; color: #6c6c70; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #c6c6c8; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; }
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .upload-box { border: 2px dashed #c6c6c8; border-radius: 8px; padding: 12px; text-align: center; background: #fafafa; position: relative; }
    .upload-box img { width: 100%; height: 100px; object-fit: contain; display: none; margin-top: 8px; }
    .upload-box input { display: none; }
    .btn { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .btn:disabled { background: #a2a2a7; }
    #result { display: none; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.5; background: #eef6ff; border-left: 4px solid var(--primary); padding: 12px; border-radius: 4px; }
    .collection-item { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #e5e5ea; padding: 8px 0; }
    .collection-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
  </style>
</head>
<body>

  <h1>✨ コレクションAIスキャン</h1>

  <!-- APIキー入力（1度入れたら自動保存） -->
  <div class="card">
    <label for="apiKey">Gemini API Key</label>
    <input type="text" id="apiKey" placeholder="APIキーを入力" onchange="saveApiKey(this.value)">
  </div>

  <!-- 撮影エリア -->
  <div class="card">
    <div class="upload-grid">
      <div class="upload-box" onclick="document.getElementById('imgFront').click()">
        <span>📷 表面を撮影</span>
        <input type="file" id="imgFront" accept="image/*" capture="environment" onchange="previewImage(this, 'prevFront')">
        <img id="prevFront">
      </div>
      <div class="upload-box" onclick="document.getElementById('imgBack').click()">
        <span>📷 裏面を撮影</span>
        <input type="file" id="imgBack" accept="image/*" capture="environment" onchange="previewImage(this, 'prevBack')">
        <img id="prevBack">
      </div>
    </div>
    <button class="btn" id="scanBtn" onclick="analyzeImages()">AIで判定 & 相場分析</button>
  </div>

  <!-- 判定結果 -->
  <div class="card" id="resultCard" style="display:none;">
    <label>解析結果</label>
    <div id="result"></div>
    <button class="btn" style="margin-top: 12px; background: #34c759;" onclick="saveToCollection()">保存する</button>
  </div>

  <!-- 保存されたコレクション -->
  <div class="card">
    <label>マイコレクション</label>
    <div id="collectionList"></div>
  </div>

  <script>
    let currentAnalysis = null;

    // 起動時に保存されているAPIキーを自動設定
    window.onload = function() {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
      }
      renderCollection();
    };

    function saveApiKey(val) {
      localStorage.setItem('gemini_api_key', val.trim());
    }

    function previewImage(input, previewId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById(previewId);
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImages() {
      const apiKeyInput = document.getElementById('apiKey').value.trim();
      const frontFile = document.getElementById('imgFront').files[0];
      const backFile = document.getElementById('imgBack').files[0];

      if (!apiKeyInput) return alert('APIキーを入力してください');
      if (!frontFile) return alert('表面の画像を撮影してください');

      saveApiKey(apiKeyInput); // 入力されたら自動保存

      const btn = document.getElementById('scanBtn');
      btn.disabled = true;
      btn.innerText = 'AI解析中...';

      try {
        const frontBase64 = await fileToBase64(frontFile);
        const parts = [{ text: getPrompt() }, { inline_data: { mime_type: frontFile.type, data: frontBase64 } }];

        if (backFile) {
          const backBase64 = await fileToBase64(backFile);
          parts.push({ inline_data: { mime_type: backFile.type, data: backBase64 } });
        }

        // AQから始まる新しいキー形式および最新エンドポイントに対応
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKeyInput}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: parts }] })
        });

        const data = await response.json();

        if (data.error) {
          alert('APIエラー: ' + data.error.message);
          return;
        }

        const text = data.candidates[0].content.parts[0].text;
        currentAnalysis = { text, frontImg: document.getElementById('prevFront').src };
        
        const resultDiv = document.getElementById('result');
        resultDiv.innerText = text;
        resultDiv.style.display = 'block';
        document.getElementById('resultCard').style.display = 'block';
      } catch (err) {
        alert('通信エラー: ' + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'AIで判定 & 相場分析';
      }
    }

    function getPrompt() {
      return `あなたは大人気のシール・トレーディングカード専門の鑑定士です。
提供された画像（1枚目:表面、2枚目:裏面※ある場合）を元に、以下の項目を簡潔に出力してください。

【1. タイトル】（例: 旧ビックリマン 第9弾 ヘッドロココ）
【2. 種別・シリーズ】（例: 食玩シール / 旧ビックリマン チョコ版）
【3. 裏面・素材の特徴】（例: 裏面黄色、ホログラム仕様、アイス版の可能性など）
【4. 推定コンディション】（画像から見える傷や状態の簡易判定）
【5. 参考相場価格帯】（一般的な市場での取引目安価格帯）
【6. 鑑定ポイント】（価値を高めるポイントや初期版/復刻版の見分けポイント）`;
    }

    function saveToCollection() {
      if (!currentAnalysis) return;
      const list = JSON.parse(localStorage.getItem('my_collection') || '[]');
      list.unshift(currentAnalysis);
      localStorage.setItem('my_collection', JSON.stringify(list));
      renderCollection();
      alert('コレクションに保存しました！');
    }

    function renderCollection() {
      const list = JSON.parse(localStorage.getItem('my_collection') || '[]');
      const container = document.getElementById('collectionList');
      container.innerHTML = list.length === 0 ? '<p style="color:#8e8e93; font-size:0.85rem;">保存されたアイテムはありません</p>' : '';
      
      list.forEach(item => {
        const title = item.text.split('\n')[0] || '不明なアイテム';
        const div = document.createElement('div');
        div.className = 'collection-item';
        div.innerHTML = `<img src="${item.frontImg}"><div><strong>${title}</strong></div>`;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
