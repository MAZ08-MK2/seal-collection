<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シールコレクション AI</title>

  <style>
    :root{
      --blue:#1677ff;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#ea580c;
      --bg:#f5f7fb;
      --line:#dde3ee;
      --text:#172033;
      --sub:#667085;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
    }

    main{
      max-width:680px;
      margin:auto;
      padding:20px 14px 42px;
    }

    h1{
      font-size:23px;
      text-align:center;
      margin:8px 0 4px;
    }

    .lead{
      text-align:center;
      color:var(--sub);
      font-size:13px;
      margin:0 0 18px;
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 2px 10px #16213a0a;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }

    .muted,
    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.5;
    }

    .hint{
      margin-top:7px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:0 0 6px;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px;
      font:inherit;
      background:#fff;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .photo{
      border:2px dashed #b8c3d6;
      border-radius:13px;
      min-height:160px;
      padding:10px;
      text-align:center;
      cursor:pointer;
      color:var(--sub);
      font-size:13px;
    }

    .photo img{
      width:100%;
      height:118px;
      object-fit:contain;
      display:none;
      margin-top:8px;
      border-radius:8px;
    }

    .photo input{
      display:none;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 14px;
      background:var(--blue);
      color:#fff;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn.secondary{
      background:#eef4ff;
      color:#125dc9;
    }

    .btn.green{
      background:var(--green);
    }

    .btn.red{
      background:var(--red);
    }

    .btn.orange{
      background:var(--orange);
    }

    .btn.small{
      padding:8px 10px;
      font-size:12px;
      width:auto;
    }

    .full{
      width:100%;
      margin-top:12px;
    }

    .status,
    .error,
    .warning,
    .success{
      margin-top:11px;
      padding:10px;
      border-radius:9px;
      font-size:13px;
      white-space:pre-wrap;
      line-height:1.5;
    }

    .status{
      display:none;
      background:#eff6ff;
      color:#1957a7;
    }

    .error{
      display:none;
      background:#fff1f2;
      color:#a9162b;
    }

    .warning{
      display:none;
      background:#fff7ed;
      color:#9a3412;
    }

    .success{
      display:none;
      background:#ecfdf3;
      color:#166534;
    }

    .result{
      display:none;
    }

    .fields{
      display:grid;
      gap:10px;
    }

    .item{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
    }

    .item:last-child{
      border:0;
    }

    .thumb{
      width:64px;
      height:64px;
      object-fit:cover;
      border-radius:10px;
      background:#edf1f7;
      flex:none;
    }

    .item h3{
      font-size:15px;
      margin:0 0 3px;
    }

    .item p{
      font-size:12px;
      color:var(--sub);
      margin:2px 0;
    }

    .item .grow{
      flex:1;
      min-width:0;
    }

    .badge{
      font-size:12px;
      color:#17643b;
      background:#e9f9ef;
      padding:5px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .marketBox{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-top:4px;
    }

    .marketTitle{
      font-weight:700;
      margin-bottom:8px;
    }

    .marketButtons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .priceRow{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:8px;
      align-items:center;
      margin-top:8px;
    }

    .priceRow span{
      font-size:12px;
      color:var(--sub);
    }

    .source{
      font-size:11px;
      color:var(--sub);
      line-height:1.5;
      margin-top:8px;
    }

    .hidden{
      display:none !important;
    }

    code{
      background:#f1f5f9;
      padding:2px 4px;
      border-radius:4px;
    }

    @media(max-width:390px){

      .grid{
        gap:7px;
      }

      .photo{
        min-height:140px;
      }

      .marketButtons{
        grid-template-columns:1fr;
      }

    }
  </style>
</head>

<body>

<main>

<script>

/* =====================================================
   基本設定
===================================================== */


/*
 * pCloud My Apps の Client ID
 */
const PCLOUD_CLIENT_ID =
  'PASTE_YOUR_PCLOUD_CLIENT_ID_HERE';


/*
 * 現在の安定版Gemini
 *
 * Google公式:
 * Gemini 3.6 Flash
 */
const GEMINI_MODEL =
  'gemini-3.6-flash';


/*
 * pCloud保存フォルダ
 */
const ROOT_FOLDER =
  'シールコレクション';


/* =====================================================
   DOM
===================================================== */

const $ =
  id => document.getElementById(id);


const store =
  localStorage;


let analysis =
  null;


let records =
  [];


/* =====================================================
   メッセージ
===================================================== */

function setStatus(text){

  $('status').textContent =
    text;

  $('status').style.display =
    text ? 'block' : 'none';

}


function setWarning(text){

  $('warning').textContent =
    text;

  $('warning').style.display =
    text ? 'block' : 'none';

}


function setSuccess(text){

  $('success').textContent =
    text;

  $('success').style.display =
    text ? 'block' : 'none';

}


function fail(error){

  console.error(error);


  setStatus('');
  setWarning('');
  setSuccess('');


  let message =
    error?.message ||
    String(error);


  /*
   * Quotaエラー
   */

  if(
    /quota/i.test(message) ||
    /rate limit/i.test(message) ||
    /exceeded/i.test(message) ||
    /429/.test(message)
  ){

    message =
      'Gemini APIの利用上限に達しています。\n\n' +
      'Google AI StudioのUsage / Rate Limitを確認してください。\n\n' +
      'これはHTMLのコードエラーではなく、Gemini API側のQuotaの問題です。';

  }


  $('error').textContent =
    message;


  $('error').style.display =
    'block';

}


function clearMessage(){

  $('error').style.display =
    'none';

  setWarning('');
  setSuccess('');
  setStatus('');

}


/* =====================================================
   HTMLエスケープ
===================================================== */

function esc(text){

  return String(text ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =====================================================
   ID
===================================================== */

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


/* =====================================================
   MIME
===================================================== */

function mime(file){

  return file.type ||
    'image/jpeg';

}


/* =====================================================
   画像プレビュー
===================================================== */

function preview(
  input,
  image
){

  const file =
    input.files[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      image.src =
        reader.result;

      image.style.display =
        'block';

    };


  reader.readAsDataURL(file);

}


$('front').onchange =
  () =>
    preview(
      $('front'),
      $('frontPreview')
    );


$('back').onchange =
  () =>
    preview(
      $('back'),
      $('backPreview')
    );


/* =====================================================
   API Key
===================================================== */

function saveKey(){

  store.setItem(
    'stickerGeminiKey',
    $('apiKey').value.trim()
  );

}


/* =====================================================
   pCloud
===================================================== */

function apiHost(){

  return (
    store.getItem(
      'pcloudHost'
    ) ||
    'api.pcloud.com'
  );

}


function token(){

  return store.getItem(
    'pcloudToken'
  );

}


function updateCloud(){

  const connected =
    !!token();


  $('cloudState').textContent =
    connected
      ? '接続済み'
      : '未接続';


  $('loginBtn')
    .classList
    .toggle(
      'hidden',
      connected
    );


  $('logoutBtn')
    .classList
    .toggle(
      'hidden',
      !connected
    );

}


function redirectURI(){

  return location.href
    .split('#')[0];

}


/* =====================================================
   pCloud OAuth
===================================================== */

function connect(){

  if(
    PCLOUD_CLIENT_ID.includes(
      'PASTE_'
    )
  ){

    throw Error(
      'PCLOUD_CLIENT_IDにpCloudのClient IDを入力してください。'
    );

  }


  if(
    location.protocol === 'file:'
  ){

    throw Error(
      'このHTMLはHTTPSで公開してから使用してください。'
    );

  }


  const state =
    uid();


  store.setItem(
    'pcloudState',
    state
  );


  const params =
    new URLSearchParams({

      client_id:
        PCLOUD_CLIENT_ID,

      response_type:
        'token',

      redirect_uri:
        redirectURI(),

      state

    });


  location.href =
    'https://my.pcloud.com/oauth2/authorize?' +
    params.toString();

}


/* =====================================================
   OAuth戻り
===================================================== */

function readOAuth(){

  if(!location.hash){
    return;
  }


  const params =
    new URLSearchParams(
      location.hash.slice(1)
    );


  if(
    params.get(
      'access_token'
    )
  ){

    if(
      params.get('state') !==
      store.getItem(
        'pcloudState'
      )
    ){

      throw Error(
        'pCloud認証の確認値が一致しません。もう一度接続してください。'
      );

    }


    store.setItem(
      'pcloudToken',
      params.get(
        'access_token'
      )
    );


    store.setItem(
      'pcloudHost',
      params.get(
        'hostname'
      ) ||
      'api.pcloud.com'
    );


    history.replaceState(
      null,
      '',
      redirectURI()
    );

  }


  else if(
    params.get('error')
  ){

    throw Error(
      'pCloud認証が完了しませんでした: ' +
      params.get('error')
    );

  }

}


/* =====================================================
   pCloud API
===================================================== */

async function pcall(
  method,
  params = {},
  form = null
){

  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const url =
    'https://' +
    apiHost() +
    '/' +
    method;


  let options;


  if(form){

    form.append(
      'access_token',
      token()
    );


    options = {

      method:'POST',

      body:form

    };

  }

  else{

    options = {

      method:'POST',

      headers:{
        'Content-Type':
          'application/x-www-form-urlencoded'
      },

      body:
        new URLSearchParams({
          ...params,
          access_token:
            token()
        })

    };

  }


  let response;


  try{

    response =
      await fetch(
        url,
        options
      );

  }

  catch{

    throw Error(
      'pCloudへ接続できませんでした。公開URL・通信環境・pCloud設定を確認してください。'
    );

  }


  let data;


  try{

    data =
      await response.json();

  }

  catch{

    throw Error(
      'pCloudから正しい応答が返りませんでした。'
    );

  }


  if(
    !response.ok ||
    data.result !== 0
  ){

    throw Error(
      'pCloudエラー: ' +
      (
        data.error ||
        data.result ||
        response.status
      )
    );

  }


  return data;

}


/* =====================================================
   pCloudルートフォルダ
===================================================== */

async function root(){

  const data =
    await pcall(
      'createfolderifnotexists',
      {
        folderid:0,
        name:ROOT_FOLDER
      }
    );


  return data.metadata.folderid;

}


/* =====================================================
   pCloudアップロード
===================================================== */

async function upload(
  folderid,
  file,
  filename
){

  const form =
    new FormData();


  form.append(
    'folderid',
    folderid
  );


  form.append(
    'nopartial',
    '1'
  );


  form.append(
    'renameifexists',
    '0'
  );


  form.append(
    'file',
    file,
    filename
  );


  return pcall(
    'uploadfile',
    {},
    form
  );

}

/* =====================================================
   Base64
===================================================== */

async function b64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            String(
              reader.result
            );


          resolve(
            result.split(',')[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   JSON解析
===================================================== */

function jsonFromText(text){

  let clean =
    String(text || '')
      .trim();


  clean =
    clean
      .replace(
        /^```json\s*/i,
        ''
      )
      .replace(
        /^```\s*/i,
        ''
      )
      .replace(
        /\s*```$/i,
        ''
      )
      .trim();


  const start =
    clean.indexOf('{');


  const end =
    clean.lastIndexOf('}');


  if(
    start >= 0 &&
    end > start
  ){

    clean =
      clean.slice(
        start,
        end + 1
      );

  }


  return JSON.parse(
    clean
  );

}


/* =====================================================
   Gemini判定
===================================================== */

async function scan(){

  clearMessage();


  const key =
    $('apiKey')
      .value
      .trim();


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!key){

    throw Error(
      'Gemini API Keyを入力してください。'
    );

  }


  if(!front){

    throw Error(
      '表面の画像を選択してください。'
    );

  }


  saveKey();


  $('scanBtn').disabled =
    true;


  try{

    setStatus(
      'Gemini 3.6 Flashで画像を解析しています…'
    );


    const parts = [

      {
        text:
          buildPrompt()
      },

      {
        inline_data:{

          mime_type:
            mime(front),

          data:
            await b64(front)

        }

      }

    ];


    if(back){

      parts.push({

        inline_data:{

          mime_type:
            mime(back),

          data:
            await b64(back)

        }

      });

    }


    /*
     * Gemini 3.6 Flash
     *
     * temperature等は使用しない。
     */

    const requestBody = {

      contents:[

        {

          role:'user',

          parts

        }

      ],

      generationConfig:{

        maxOutputTokens:500,

        responseMimeType:
          'application/json'

      }

    };


    const url =
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(
        GEMINI_MODEL
      ) +
      ':generateContent?key=' +
      encodeURIComponent(
        key
      );


    const response =
      await fetch(
        url,
        {

          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );


    let data;


    try{

      data =
        await response.json();

    }

    catch{

      throw Error(
        'Geminiから正しい応答が返りませんでした。'
      );

    }


    if(!response.ok){

      const message =
        data?.error?.message ||
        'HTTP ' +
        response.status;


      if(
        response.status === 429 ||
        /quota/i.test(message) ||
        /rate limit/i.test(message)
      ){

        throw Error(
          'Gemini APIの利用上限に達しています。\n\n' +
          'Google AI StudioのUsage / Rate Limitを確認してください。\n\n' +
          'Gemini API KeyのQuotaが0の場合、コードを変更しても判定できません。'
        );

      }


      throw Error(
        'Geminiエラー: ' +
        message
      );

    }


    const text =
      data
        ?.candidates?.[0]
        ?.content
        ?.parts
        ?.map(
          part =>
            part.text || ''
        )
        .join('') ||
        '';


    if(!text){

      throw Error(
        'Geminiから判定結果が返ってきませんでした。'
      );

    }


    analysis =
      jsonFromText(
        text
      );


    /*
     * フォーム反映
     */

    $('name').value =
      analysis.name || '';


    $('series').value =
      analysis.series || '';


    const kinds = [
      'シール',
      'トレカ',
      '食玩'
    ];


    $('kind').value =
      kinds.includes(
        analysis.kind
      )
        ? analysis.kind
        : 'シール';


    const rarities = [
      'N',
      'R',
      'SR',
      'SSR',
      'SC',
      'UR',
      'SEC',
      'PR',
      '不明'
    ];


    $('rarity').value =
      rarities.includes(
        analysis.rarity
      )
        ? analysis.rarity
        : '不明';


    $('memo').value =
      analysis.memo || '';


    $('mercariPrice').value =
      '';


    $('mandarakePrice').value =
      '';


    $('price').value =
      '';


    $('resultCard').style.display =
      'block';


    setSuccess(
      'AI判定が完了しました。商品名・シリーズ・レア度を確認してください。'
    );


    setStatus('');

  }

  finally{

    $('scanBtn').disabled =
      false;

  }

}


/* =====================================================
   検索キーワード
===================================================== */

function getSearchKeyword(){

  const name =
    $('name')
      .value
      .trim();


  const series =
    $('series')
      .value
      .trim();


  if(
    !name ||
    name === '確認できません'
  ){

    return '';

  }


  if(
    series &&
    series !== '確認できません'
  ){

    return (
      series +
      ' ' +
      name
    );

  }


  return name;

}

/* =====================================================
   pCloud保存
===================================================== */

async function save(){

  clearMessage();


  if(!analysis){

    throw Error(
      '先にAIで判定してください。'
    );

  }


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!front){

    throw Error(
      '表面の画像がありません。'
    );

  }


  $('saveBtn').disabled =
    true;


  try{

    setStatus(
      'pCloudへ保存しています…'
    );


    const rootFolderId =
      await root();


    const item =
      current();


    const folder =
      await pcall(
        'createfolderifnotexists',
        {

          folderid:
            rootFolderId,

          name:
            'item-' +
            item.id

        }
      );


    const folderid =
      folder.metadata.folderid;


    function ext(file){

      return (
        file.name
          .split('.')
          .pop() ||
        'jpg'
      )
      .replace(
        /[^a-z0-9]/gi,
        ''
      )
      .toLowerCase();

    }


    /*
     * 表面
     */

    await upload(
      folderid,
      front,
      'front.' +
      ext(front)
    );


    /*
     * 裏面
     */

    if(back){

      await upload(
        folderid,
        back,
        'back.' +
        ext(back)
      );

    }


    /*
     * data.json
     */

    item.folderid =
      folderid;


    const dataFile =
      new File(

        [
          JSON.stringify(
            item,
            null,
            2
          )
        ],

        'data.json',

        {
          type:
            'application/json'
        }

      );


    await upload(
      folderid,
      dataFile,
      'data.json'
    );


    item.preview =
      $('frontPreview').src;


    records.unshift(
      item
    );


    render();


    setSuccess(
      'pCloudに保存しました。'
    );


    setStatus('');

  }

  finally{

    $('saveBtn').disabled =
      false;

  }

}


/* =====================================================
   pCloud一覧更新
===================================================== */

async function refresh(){

  clearMessage();


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  setStatus(
    'pCloudの保存データを確認しています…'
  );


  const rootFolderId =
    await root();


  const data =
    await pcall(
      'listfolder',
      {

        folderid:
          rootFolderId,

        recursive:0

      }
    );


  const folders =
    (
      data.metadata.contents ||
      []
    )
    .filter(
      item =>
        item.isfolder &&
        item.name.startsWith(
          'item-'
        )
    );


  records = [];


  for(
    const folder of folders
  ){

    try{

      const files =
        await pcall(
          'listfolder',
          {

            folderid:
              folder.folderid,

            recursive:0

          }
        );


      const jsonFile =
        (
          files.metadata.contents ||
          []
        )
        .find(
          item =>
            !item.isfolder &&
            item.name ===
              'data.json'
        );


      if(jsonFile){

        const fileInfo =
          await pcall(
            'getfilelink',
            {

              fileid:
                jsonFile.fileid,

              forcedownload:1

            }
          );


        const response =
          await fetch(
            fileInfo.link
          );


        const item =
          await response.json();


        item.folderid =
          folder.folderid;


        records.push(
          item
        );

      }

      else{

        records.push({

          id:
            folder.name.slice(5),

          folderid:
            folder.folderid,

          name:
            '保存済みアイテム',

          series:'',
          kind:'',
          rarity:'',
          price:'',
          mercariPrice:'',
          mandarakePrice:'',
          memo:'',

          savedAt:
            folder.modified

        });

      }

    }

    catch(error){

      console.warn(
        'data.json読み込み失敗',
        error
      );


      records.push({

        id:
          folder.name.slice(5),

        folderid:
          folder.folderid,

        name:
          '保存済みアイテム',

        series:'',
        kind:'',
        rarity:'',
        price:'',
        mercariPrice:'',
        mandarakePrice:'',
        memo:'',

        savedAt:
          folder.modified

      });

    }

  }


  records.sort(
    (a,b) =>
      new Date(
        b.savedAt || 0
      ) -
      new Date(
        a.savedAt || 0
      )
  );


  render();


  setSuccess(
    records.length +
    '件読み込みました。'
  );


  setStatus('');

}


/* =====================================================
   削除
===================================================== */

async function del(id){

  const record =
    records.find(
      item =>
        item.id === id
    );


  if(!record){
    return;
  }


  if(
    !confirm(
      'このアイテムをpCloudから削除します。\nよろしいですか？'
    )
  ){

    return;

  }


  clearMessage();


  try{

    setStatus(
      'pCloudから削除しています…'
    );


    await pcall(
      'deletefolderrecursive',
      {

        folderid:
          record.folderid

      }
    );


    records =
      records.filter(
        item =>
          item.id !== id
      );


    render();


    setSuccess(
      '削除しました。'
    );


    setStatus('');

  }

  catch(error){

    fail(error);

  }

}


/* =====================================================
   一覧表示
===================================================== */

function render(){

  if(!records.length){

    $('list').innerHTML =
      '<p class="muted">まだ保存されていません。</p>';

    return;

  }


  $('list').innerHTML =
    records
      .map(
        record => `

          <div class="item">

            <div class="grow">

              <h3>
                ${esc(record.name)}
              </h3>

              <p>
                ${esc(record.series)}
               　
                ${esc(record.kind)}
               　
                ${esc(record.rarity)}
              </p>

              <p>
                総合価格：
                ${esc(record.price)}
              </p>

              ${
                record.mercariPrice
                  ? `
                    <p>
                      メルカリ：
                      ${esc(
                        record.mercariPrice
                      )}
                    </p>
                  `
                  : ''
              }

              ${
                record.mandarakePrice
                  ? `
                    <p>
                      まんだらけ：
                      ${esc(
                        record.mandarakePrice
                      )}
                    </p>
                  `
                  : ''
              }

              <p>
                ${
                  record.savedAt
                    ? new Date(
                        record.savedAt
                      )
                      .toLocaleDateString(
                        'ja-JP'
                      )
                    : ''
                }
              </p>

            </div>


            <button
              class="btn small red"
              onclick="del('${esc(record.id)}')">
              削除
            </button>

          </div>

        `
      )
      .join('');

}
