<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>シールコレクション AI</title>

<style>
:root{
  --blue:#1677ff;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --purple:#7c3aed;
  --bg:#f5f7fb;
  --line:#dde3ee;
  --text:#172033;
  --sub:#667085;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

main{
  max-width:680px;
  margin:auto;
  padding:20px 14px 42px;
}

h1{
  font-size:23px;
  text-align:center;
  margin:8px 0 4px;
}

.lead{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
  margin:0 0 4px;
}

.buildStamp{
  text-align:center;
  color:#9aa5b8;
  font-size:11px;
  margin:0 0 18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #16213a0a;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:0 0 6px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.photo{
  border:2px dashed #b8c3d6;
  border-radius:13px;
  min-height:160px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  color:var(--sub);
  font-size:13px;
}

.photo img{
  width:100%;
  height:118px;
  object-fit:contain;
  display:none;
  margin-top:8px;
  border-radius:8px;
}

.photo input{
  display:none;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn.secondary{
  background:#eef4ff;
  color:#125dc9;
}

.btn.green{
  background:var(--green);
}

.full{
  width:100%;
  margin-top:12px;
}

.status,
.error,
.warning,
.success{
  margin-top:11px;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  white-space:pre-wrap;
  line-height:1.5;
}

.status{
  display:none;
  background:#eff6ff;
  color:#1957a7;
}

.error{
  display:none;
  background:#fff1f2;
  color:#a9162b;
}

.warning{
  display:none;
  background:#fff7ed;
  color:#9a3412;
}

.success{
  display:none;
  background:#ecfdf3;
  color:#166534;
}

.result{
  display:none;
}

.fields{
  display:grid;
  gap:10px;
}

.hint,
.muted{
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}

.hint{
  margin-top:7px;
}

.marketBox{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-top:4px;
}

.marketTitle{
  font-weight:700;
  margin-bottom:8px;
}

.aiBadge{
  display:inline-block;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  background:#eef4ff;
  color:#125dc9;
  margin-bottom:8px;
}

.sourceBox{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  font-size:11px;
  line-height:1.6;
  color:var(--sub);
  word-break:break-word;
}

.confirmBox{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.confirmTitle{
  font-weight:700;
  color:#166534;
  margin-bottom:6px;
}

.confirmText{
  font-size:12px;
  color:#166534;
  line-height:1.6;
}

#cardView{
  display:none;
}

.screenshotWrap{
  background:#fff;
  border-radius:22px;
  padding:22px 18px 26px;
  border:1px solid var(--line);
  box-shadow:0 4px 18px #16213a12;
}

.screenshotHeader{
  text-align:center;
  font-size:12px;
  color:var(--sub);
  letter-spacing:.04em;
  margin-bottom:14px;
}

.screenshotPhotos{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.screenshotPhotos img{
  flex:1;
  width:0;
  min-height:150px;
  max-height:260px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  border:1px solid var(--line);
}

.screenshotPhotos.single img{
  max-height:320px;
}

.screenshotName{
  font-size:21px;
  font-weight:800;
  margin:0 0 3px;
  text-align:center;
}

.screenshotSeries{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  margin:0 0 14px;
}

.screenshotBadges{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.badge{
  font-size:13px;
  padding:6px 12px;
  border-radius:999px;
}

.kindBadge{
  background:#eef4ff;
  color:#125dc9;
}

.rarityBadge{
  background:#fff7ed;
  color:#9a3412;
}

.screenshotPriceBox{
  text-align:center;
  background:#ecfdf3;
  border:1px solid #bbf7d0;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.screenshotPriceLabel{
  font-size:12px;
  color:#166534;
  margin-bottom:4px;
}

.screenshotPrice{
  font-size:24px;
  font-weight:800;
  color:#166534;
}

.screenshotMemoLabel{
  font-size:12px;
  font-weight:700;
  color:var(--sub);
  margin-bottom:4px;
}

.screenshotMemo{
  font-size:13px;
  line-height:1.6;
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
  white-space:pre-wrap;
}

.screenshotMeta{
  text-align:right;
  font-size:11px;
  color:#9aa5b8;
  margin-top:14px;
}

.instructionBox{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:14px;
  padding:14px;
  margin-top:16px;
  font-size:13px;
  color:#1957a7;
  line-height:1.7;
}

.divider{
  height:1px;
  background:var(--line);
  margin:15px 0;
}

@media(max-width:390px){
  .grid{
    gap:7px;
  }

  .photo{
    min-height:140px;
  }

  .screenshotPhotos img{
    min-height:120px;
  }
}
</style>
</head>

<body>

<main>

</span>

<div class="fields">

<script>

const MODEL =
  "gemini-3.6-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  + MODEL
  + ":generateContent";

const BUILD =
  "2026-08-15 / Gemini 3.6 Flash / Search OFF テスト";


const $ =
  id =>
    document.getElementById(id);


const apiKeyEl = $("apiKey");
const frontEl = $("front");
const backEl = $("back");
const frontPreview = $("frontPreview");
const backPreview = $("backPreview");
const scanBtn = $("scanBtn");
const scanStatus = $("scanStatus");
const scanWarning = $("scanWarning");
const scanSuccess = $("scanSuccess");
const scanError = $("scanError");
const resultCard = $("resultCard");
const nameEl = $("name");
const seriesEl = $("series");
const kindEl = $("kind");
const rarityEl = $("rarity");
const priceEl = $("price");
const researchMemoEl = $("researchMemo");
const sourcesEl = $("sources");
const confirmBtn = $("confirmBtn");
const formView = $("formView");
const cardView = $("cardView");
const screenshotPhotos = $("screenshotPhotos");
const screenshotFront = $("screenshotFront");
const screenshotBack = $("screenshotBack");
const screenshotName = $("screenshotName");
const screenshotSeries = $("screenshotSeries");
const screenshotKind = $("screenshotKind");
const screenshotRarity = $("screenshotRarity");
const screenshotPrice = $("screenshotPrice");
const screenshotMemo = $("screenshotMemo");
const screenshotMeta = $("screenshotMeta");
const backBtn = $("backBtn");


const savedApiKey =
  localStorage.getItem(
    "seal_gemini_api_key"
  );

if(savedApiKey){
  apiKeyEl.value =
    savedApiKey;
}


apiKeyEl.addEventListener(
  "change",
  () => {

    const value =
      apiKeyEl.value.trim();

    if(value){

      localStorage.setItem(
        "seal_gemini_api_key",
        value
      );

    }

  }
);


let frontData = null;
let backData = null;
let frontMime = null;
let backMime = null;


function loadImage(
  file,
  previewEl,
  type
){

  if(!file){
    return;
  }

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showError(
      "画像ファイルを選択してください。"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      const result =
        reader.result;

      previewEl.src =
        result;

      previewEl.style.display =
        "block";


      if(
        type === "front"
      ){

        frontData =
          result.split(",")[1];

        frontMime =
          file.type;

      }else{

        backData =
          result.split(",")[1];

        backMime =
          file.type;

      }

    };


  reader.onerror =
    () => {

      showError(
        "画像の読み込みに失敗しました。"
      );

    };


  reader.readAsDataURL(
    file
  );

}


frontEl.addEventListener(
  "change",
  () => {

    loadImage(
      frontEl.files[0],
      frontPreview,
      "front"
    );

  }
);


backEl.addEventListener(
  "change",
  () => {

    loadImage(
      backEl.files[0],
      backPreview,
      "back"
    );

  }
);


function hideMessages(){

  scanStatus.style.display =
    "none";

  scanWarning.style.display =
    "none";

  scanSuccess.style.display =
    "none";

  scanError.style.display =
    "none";

}


function showStatus(
  message
){

  scanStatus.textContent =
    message;

  scanStatus.style.display =
    "block";

}


function showSuccess(
  message
){

  scanSuccess.textContent =
    message;

  scanSuccess.style.display =
    "block";

}


function showError(
  message
){

  scanError.textContent =
    message;

  scanError.style.display =
    "block";

}


/* =========================================================
   429詳細解析
========================================================= */

async function getApiError(
  response
){

  let text =
    "";

  try{

    text =
      await response.text();

  }catch(e){}


  let json =
    null;


  try{

    json =
      JSON.parse(
        text
      );

  }catch(e){}


  const err =
    json?.error ||
    json ||
    {};


  const message =
    err?.message ||
    text ||
    `HTTP ${response.status}`;


  const lines =
    [];


  if(
    err?.status
  ){

    lines.push(
      `status: ${err.status}`
    );

  }


  if(
    err?.code !==
    undefined
  ){

    lines.push(
      `code: ${err.code}`
    );

  }


  const details =
    Array.isArray(
      err?.details
    )
      ? err.details
      : [];


  for(
    const detail
    of details
  ){

    const type =
      detail?.["@type"] ||
      "";


    if(type){

      lines.push(
        `type: ${type}`
      );

    }


    if(
      detail?.retryDelay
    ){

      lines.push(
        `retryDelay: ${detail.retryDelay}`
      );

    }


    if(
      Array.isArray(
        detail?.violations
      )
    ){

      detail.violations.forEach(
        (
          violation,
          index
        ) => {

          lines.push(
            `violation ${index + 1}:`
          );


          if(
            violation?.quotaMetric
          ){

            lines.push(
              `quotaMetric: ${violation.quotaMetric}`
            );

          }


          if(
            violation?.quotaId
          ){

            lines.push(
              `quotaId: ${violation.quotaId}`
            );

          }


          if(
            violation?.quotaValue !==
            undefined
          ){

            lines.push(
              `quotaValue: ${violation.quotaValue}`
            );

          }


          if(
            violation?.quotaDimensions
          ){

            lines.push(
              `quotaDimensions: ${
                JSON.stringify(
                  violation.quotaDimensions
                )
              }`
            );

          }

        }
      );

    }

  }


  return {

    message:
      message,

    detailsText:
      lines.join("\n")

  };

}


/* =========================================================
   JSON解析
========================================================= */

function extractJson(
  text
){

  if(!text){

    throw new Error(
      "Geminiから回答が返されませんでした。"
    );

  }


  let cleaned =
    text.trim();


  cleaned =
    cleaned.replace(
      /^```json\s*/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /^```\s*/i,
      ""
    );


  cleaned =
    cleaned.replace(
      /\s*```$/i,
      ""
    );


  try{

    return JSON.parse(
      cleaned
    );

  }catch(e){}


  const first =
    cleaned.indexOf(
      "{"
    );

  const last =
    cleaned.lastIndexOf(
      "}"
    );


  if(
    first >= 0 &&
    last > first
  ){

    try{

      return JSON.parse(
        cleaned.slice(
          first,
          last + 1
        )
      );

    }catch(e){}

  }


  throw new Error(
    "Geminiの回答をJSONとして解析できませんでした。\n\n"
    + cleaned
  );

}


/* =========================================================
   プロンプト
========================================================= */

function buildPrompt(){

  return `
あなたは日本のコレクション品を画像から判定するAIです。

今回はWeb検索を使用せず、
画像だけから判定してください。

【重要】
・画像を最優先する
・表面と裏面を照合する
・推測できない場合は「確認できません」
・現在の相場はWeb検索を使わないため「確認できません」とする

必ずJSONだけを返してください。

{
  "name":"シール名",
  "series":"シリーズ・作品名",
  "kind":"シール",
  "rarity":"レア度",
  "price":"確認できません",
  "researchMemo":"画像から確認できた内容",
  "confidence":"高・中・低"
}
`;

}


/* =========================================================
   Gemini実行
========================================================= */

async function runGeminiAnalysis(){

  const apiKey =
    apiKeyEl.value.trim();


  if(!apiKey){

    throw new Error(
      "Gemini API Keyを入力してください。"
    );

  }


  if(!frontData){

    throw new Error(
      "表面の画像を選択してください。"
    );

  }


  const parts =
    [

      {
        text:
          buildPrompt()
      },

      {
        inline_data:{
          mime_type:
            frontMime ||
            "image/jpeg",

          data:
            frontData
        }
      }

    ];


  if(
    backData
  ){

    parts.push({

      inline_data:{
        mime_type:
          backMime ||
          "image/jpeg",

        data:
          backData
      }

    });

  }


  /*
   * Google Search groundingは
   * 今回の切り分けテストでは使用しない
   */

  const body = {

    contents:[
      {
        role:
          "user",

        parts:
          parts
      }
    ],

    generationConfig:{

      temperature:
        0.1,

      responseMimeType:
        "application/json"

    }

  };


  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers:{

          "Content-Type":
            "application/json",

          "x-goog-api-key":
            apiKey

        },

        body:
          JSON.stringify(
            body
          )

      }
    );


  if(
    response.status ===
    429
  ){

    const info =
      await getApiError(
        response
      );


    const error =
      new Error(

        "Gemini APIの利用上限に達しました。"
        + "\n\n"
        + "429 Too Many Requests"
        + "\n\n"
        + info.message
        + (
            info.detailsText
              ? "\n\n===== quota details =====\n"
                + info.detailsText
              : ""
          )

      );


    error.code =
      429;


    throw error;

  }


  if(
    !response.ok
  ){

    const info =
      await getApiError(
        response
      );


    throw new Error(

      `Gemini APIエラー（HTTP ${response.status}）`
      + "\n\n"
      + info.message

    );

  }


  const data =
    await response.json();


  const candidate =
    data?.candidates?.[0];


  const text =
    candidate?.content?.parts
      ?.map(
        part =>
          part.text ||
          ""
      )
      .join("")
      .trim();


  if(
    !text
  ){

    throw new Error(
      "Geminiから解析結果が返されませんでした。"
    );

  }


  return {

    result:
      extractJson(
        text
      )

  };

}


/* =========================================================
   AI判定ボタン
========================================================= */

scanBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    if(
      !frontData
    ){

      showError(
        "表面の画像を選択してください。"
      );

      return;

    }


    const apiKey =
      apiKeyEl.value.trim();


    if(
      !apiKey
    ){

      showError(
        "Gemini API Keyを入力してください。"
      );

      return;

    }


    localStorage.setItem(
      "seal_gemini_api_key",
      apiKey
    );


    scanBtn.disabled =
      true;


    scanBtn.textContent =
      "🔎 AI判定中…";


    resultCard.style.display =
      "none";


    showStatus(
      "画像を確認しています…\n"
      + "今回はGoogle検索を使わず、Gemini 3.6 Flash本体だけでテストします。"
    );


    try{

      const {
        result
      } =
        await runGeminiAnalysis();


      nameEl.value =
        String(
          result?.name ||
          ""
        ).trim();


      seriesEl.value =
        String(
          result?.series ||
          ""
        ).trim();


      const kind =
        String(
          result?.kind ||
          "シール"
        ).trim();


      const kindExists =
        Array.from(
          kindEl.options
        ).some(
          option =>
            option.value ===
            kind
        );


      kindEl.value =
        kindExists
          ? kind
          : "シール";


      rarityEl.value =
        String(
          result?.rarity ||
          "確認できません"
        ).trim();


      priceEl.value =
        String(
          result?.price ||
          "確認できません"
        ).trim();


      researchMemoEl.value =
        String(
          result?.researchMemo ||
          ""
        ).trim();


      sourcesEl.textContent =
        "今回はGoogle検索を一時停止しています。";


      resultCard.style.display =
        "block";


      showSuccess(
        "AI判定が完了しました。\n"
        + "Google検索なしでGemini本体が正常に動作しました。"
      );


      resultCard.scrollIntoView({
        behavior:
          "smooth",

        block:
          "start"
      });

    }
    catch(
      error
    ){

      console.error(
        error
      );


      showError(
        error.message ||
        "AI判定中にエラーが発生しました。"
      );

    }
    finally{

      scanBtn.disabled =
        false;


      scanBtn.textContent =
        "🔎 AIで判定する";

    }

  }
);


/* =========================================================
   確定
========================================================= */

confirmBtn.addEventListener(
  "click",
  () => {

    const confirmed = {

      name:
        nameEl.value.trim(),

      series:
        seriesEl.value.trim(),

      kind:
        kindEl.value.trim(),

      rarity:
        rarityEl.value.trim(),

      price:
        priceEl.value.trim(),

      researchMemo:
        researchMemoEl.value.trim(),

      front:
        frontPreview.src ||
        "",

      back:
        backPreview.src ||
        ""

    };


    screenshotName.textContent =
      confirmed.name;


    screenshotSeries.textContent =
      confirmed.series;


    screenshotKind.textContent =
      confirmed.kind;


    screenshotRarity.textContent =
      confirmed.rarity;


    screenshotPrice.textContent =
      confirmed.price;


    screenshotMemo.textContent =
      confirmed.researchMemo ||
      "調査メモなし";


    screenshotFront.src =
      confirmed.front;


    if(
      confirmed.back
    ){

      screenshotBack.src =
        confirmed.back;

      screenshotBack.style.display =
        "block";

      screenshotPhotos.classList
        .remove(
          "single"
        );

    }else{

      screenshotBack.style.display =
        "none";

      screenshotPhotos.classList
        .add(
          "single"
        );

    }


    screenshotMeta.textContent =
      "確定日："
      + new Date()
          .toLocaleDateString(
            "ja-JP"
          );


    formView.style.display =
      "none";


    cardView.style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


backBtn.addEventListener(
  "click",
  () => {

    cardView.style.display =
      "none";


    formView.style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


document.querySelector(
  ".buildStamp"
).textContent =
  BUILD;


hideMessages();

</script>
