<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131019">
<title>シール台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#131019; --surface:#1E1A2B; --raise:#272138; --line:#38304F;
  --text:#F0EDF7; --muted:#9A93B0;
  --gold:#E8B33C; --red:#E4453C;
  --prism:linear-gradient(115deg,#7DE2FF 0%,#B79CFF 38%,#FF9ECF 70%,#FFE9A8 100%);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{
  font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
  font-size:15px;line-height:1.7;
  padding:0 18px calc(48px + env(safe-area-inset-bottom));
  max-width:520px;margin:0 auto;
  -webkit-text-size-adjust:100%;
}
header{padding:26px 0 20px}
.wordmark{
  font-family:"Dela Gothic One",sans-serif;font-size:29px;line-height:1.15;
  letter-spacing:.01em;margin:0;
  background:var(--prism);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{color:var(--muted);font-size:12.5px;margin:6px 0 0;letter-spacing:.06em}

.steps{display:flex;gap:6px;margin:0 0 22px;padding:0;list-style:none}
.steps li{
  flex:1;font-size:10.5px;letter-spacing:.08em;color:var(--muted);
  border-top:2px solid var(--line);padding-top:7px;transition:color .3s,border-color .3s;
}
.steps li .n{font-family:"Roboto Mono",monospace;display:block;font-size:10px;opacity:.6}
.steps li[data-on]{color:var(--text);border-top-color:var(--gold)}

section{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px;margin-bottom:16px;
}
section[hidden]{display:none}
h2{
  font-family:"Dela Gothic One",sans-serif;font-size:15px;font-weight:400;
  margin:0 0 4px;letter-spacing:.02em;
}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}

/* 撮影スロット — シールそのものの形 */
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cell{display:flex;flex-direction:column;gap:9px}
.slot{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;display:block}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{
  margin-top:0;padding:9px 4px;font-size:12.5px;font-weight:500;border-radius:9px;
  background:var(--raise);color:var(--text);border:1px solid var(--line);
}
.pill[data-used]{border-color:var(--gold);color:var(--gold)}
.slot .face{
  position:absolute;inset:0;border-radius:50%;
  border:2px dashed var(--line);background:var(--raise);
  display:grid;place-content:center;text-align:center;gap:4px;
  transition:border-color .25s;
}
.slot[data-back] .face{border-style:dotted}
.slot .face b{font-family:"Dela Gothic One",sans-serif;font-size:16px;font-weight:400}
.slot .face span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:none}
.slot[data-filled] img{display:block}
.slot[data-filled] .face{opacity:0;pointer-events:none}
.slot[data-filled]::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:2px solid transparent;background:var(--prism) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
/* 判別中のスキャン */
.slots[data-scanning] .slot[data-filled]::before{
  content:"";position:absolute;left:0;right:0;height:36%;border-radius:50%;
  background:var(--prism);opacity:.5;mix-blend-mode:screen;
  animation:sweep 1.15s ease-in-out infinite;z-index:2;
}
@keyframes sweep{0%{top:-36%}100%{top:100%}}

button{
  font-family:"Zen Kaku Gothic New",sans-serif;font-size:15px;font-weight:700;
  width:100%;padding:14px;border-radius:11px;border:0;cursor:pointer;
  background:var(--prism);color:#17131F;margin-top:16px;
}
button:disabled{background:var(--raise);color:var(--muted);cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 判別結果 */
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cat{
  font-family:"Dela Gothic One",sans-serif;font-size:13px;padding:5px 12px;border-radius:99px;
  background:var(--gold);color:#17131F;
}
.conf{font-family:"Roboto Mono",monospace;font-size:11px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:3px;font-size:15px}
.stars i{color:var(--line);font-style:normal}
.why{
  font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);
  padding-left:12px;margin:0 0 18px;
}

label{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border-radius:9px;background:var(--ink);
  border:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;
}
textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.links{display:grid;gap:9px;margin:4px 0 2px}
.links a{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:13px 15px;border-radius:11px;border:1px solid var(--line);
  background:var(--raise);color:var(--text);text-decoration:none;font-size:14px;font-weight:500;
}
.links a small{color:var(--muted);font-size:11px;font-weight:400}
.links a::after{content:"↗";color:var(--gold)}

.note{font-size:11.5px;color:var(--muted);margin:14px 0 0;line-height:1.6}
.status{margin-top:14px;font-size:13px;min-height:20px}
.status[data-kind=error]{color:var(--red)}
.status[data-kind=ok]{color:var(--gold)}

.ledger{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tally{
  flex:1;min-width:92px;background:var(--raise);border-radius:11px;padding:11px 13px;
}
.tally b{display:block;font-family:"Roboto Mono",monospace;font-size:21px;color:var(--gold)}
.tally span{font-size:11px;color:var(--muted)}
.log{list-style:none;padding:0;margin:0;font-size:13px}
.log li{padding:10px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.log li span{color:var(--muted);font-size:11px;font-family:"Roboto Mono",monospace;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <h1 class="wordmark">シール台帳</h1>
  <p class="tagline">表と裏を撮る。判別する。pCloudへ仕分ける。</p>
</header>

<ol class="steps" id="steps">
  <li data-step="1" data-on><span class="n">01</span>撮る</li>
  <li data-step="2"><span class="n">02</span>判別</li>
  <li data-step="3"><span class="n">03</span>相場</li>
  <li data-step="4"><span class="n">04</span>保存</li>
</ol>

<section id="capture">
  <h2>表と裏を撮る</h2>
  <p class="hint">その場で撮っても、アルバムの写真を選んでも構いません。裏面の番号や印刷が読めるほど判別が当たります。</p>
  <div class="slots" id="slots">
    <div class="cell">
      <div class="slot" data-side="front">
        <img alt="表面のプレビュー" id="frontPreview">
        <span class="face"><b>表</b><span>キャラ面</span></span>
      </div>
      <input type="file" accept="image/*" capture="environment" id="frontCamera" hidden>
      <input type="file" accept="image/*" id="frontLibrary" hidden>
      <div class="pick">
        <button type="button" class="pill" data-open="frontCamera">撮る</button>
        <button type="button" class="pill" data-open="frontLibrary">選ぶ</button>
      </div>
    </div>
    <div class="cell">
      <div class="slot" data-side="back" data-back>
        <img alt="裏面のプレビュー" id="backPreview">
        <span class="face"><b>裏</b><span>印刷面</span></span>
      </div>
      <input type="file" accept="image/*" capture="environment" id="backCamera" hidden>
      <input type="file" accept="image/*" id="backLibrary" hidden>
      <div class="pick">
        <button type="button" class="pill" data-open="backCamera">撮る</button>
        <button type="button" class="pill" data-open="backLibrary">選ぶ</button>
      </div>
    </div>
  </div>
  <button id="identifyBtn" disabled>判別する</button>
  <p class="status" id="captureStatus"></p>
</section>

<section id="result" hidden>
  <h2>判別結果</h2>
  <div class="verdict">
    <span class="cat" id="catBadge">—</span>
    <span class="stars" id="stars"></span>
    <span class="conf" id="conf"></span>
  </div>
  <p class="why" id="why"></p>

  <label for="fCategory">種類</label>
  <select id="fCategory">
    <option>ビックリマン</option><option>食玩</option><option>トレカ</option>
  </select>

  <label for="fSeries">シリーズ</label>
  <input type="text" id="fSeries" placeholder="悪魔VS天使 第1弾">

  <div class="row">
    <div>
      <label for="fName">名前</label>
      <input type="text" id="fName">
    </div>
    <div>
      <label for="fNumber">番号</label>
      <input type="text" id="fNumber">
    </div>
  </div>

  <div class="row">
    <div>
      <label for="fRank">格付け</label>
      <input type="text" id="fRank" placeholder="ヘッド / 天使 / 通常">
    </div>
    <div>
      <label for="fRarity">レア度 1–5</label>
      <input type="number" id="fRarity" min="1" max="5">
    </div>
  </div>

  <label for="fCondition">状態メモ</label>
  <textarea id="fCondition"></textarea>

  <button id="toMarketBtn">相場を調べる</button>
</section>

<section id="market" hidden>
  <h2>相場を確認する</h2>
  <p class="hint">両サイトとも自動取得は規約で禁止されています。リンクを開いて、実際の売れた価格を自分の目で入れてください。</p>

  <label for="fKeyword">検索キーワード</label>
  <input type="text" id="fKeyword">

  <div class="links" id="links"></div>

  <div class="row">
    <div>
      <label for="fMin">相場 下限 ¥</label>
      <input type="number" id="fMin" inputmode="numeric">
    </div>
    <div>
      <label for="fMax">相場 上限 ¥</label>
      <input type="number" id="fMax" inputmode="numeric">
    </div>
  </div>

  <label for="fPriceNote">価格メモ</label>
  <textarea id="fPriceNote" placeholder="メルカリ売切れ 3件 / まんだらけ 在庫なし"></textarea>

  <button id="saveBtn">pCloudに保存</button>
  <button class="ghost" id="backBtn">判別結果に戻る</button>
  <p class="status" id="saveStatus"></p>
  <p class="note" id="destNote"></p>
</section>

<section id="ledger">
  <h2>台帳</h2>
  <div class="ledger" id="tallies"></div>
  <ul class="log" id="log"></ul>
</section>

<script>
const $ = id => document.getElementById(id);
const files = { front:null, back:null };
let result = null;

function step(n){
  document.querySelectorAll('#steps li').forEach(li=>{
    li.toggleAttribute('data-on', Number(li.dataset.step) <= n);
  });
}
function say(el, msg, kind){ el.textContent = msg; el.dataset.kind = kind || ''; }

function bindSlot(side){
  const preview = $(side + 'Preview');
  const slot = document.querySelector(`.slot[data-side="${side}"]`);
  const cell = slot.closest('.cell');

  const accept = (file, source) => {
    if(!file) return;
    if(files[side]) URL.revokeObjectURL(preview.src);
    files[side] = file;
    preview.src = URL.createObjectURL(file);
    slot.setAttribute('data-filled','');
    cell.querySelectorAll('.pill').forEach(p => {
      p.toggleAttribute('data-used', p.dataset.open === source);
    });
    $('identifyBtn').disabled = !(files.front && files.back);
    say($('captureStatus'), '');
  };

  ['Camera','Library'].forEach(kind => {
    const input = $(side + kind);
    input.addEventListener('change', () => {
      accept(input.files[0], side + kind);
      input.value = '';   // 同じ写真をもう一度選べるように
    });
  });

  // 空の丸をタップしたらカメラ。アルバムは下のボタンから。
  slot.addEventListener('click', () => $(side + 'Camera').click());
}
bindSlot('front'); bindSlot('back');

document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => $(btn.dataset.open).click());
});

$('identifyBtn').addEventListener('click', async () => {
  const btn = $('identifyBtn');
  btn.disabled = true;
  $('slots').setAttribute('data-scanning','');
  say($('captureStatus'), '判別中…', '');
  try{
    const body = new FormData();
    body.append('front', files.front);
    body.append('back', files.back);
    const res = await fetch('/api/identify', { method:'POST', body });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    result = await res.json();
    fillResult(result);
    say($('captureStatus'), '');
    step(2);
    $('result').scrollIntoView({behavior:'smooth', block:'start'});
  }catch(err){
    say($('captureStatus'), '判別できませんでした。' + err.message, 'error');
  }finally{
    $('slots').removeAttribute('data-scanning');
    btn.disabled = false;
  }
});

function fillResult(r){
  $('result').hidden = false;
  $('catBadge').textContent = r.category || '—';
  const rarity = r.rarity || 1;
  $('stars').innerHTML = '★'.repeat(rarity) + '<i>' + '★'.repeat(5-rarity) + '</i>';
  $('conf').textContent = '確度 ' + Math.round((r.confidence||0)*100) + '%';
  $('why').textContent = r.reasoning || '';
  $('fCategory').value = r.category || '食玩';
  $('fSeries').value = r.series || '';
  $('fName').value = r.name || '';
  $('fNumber').value = r.number || '';
  $('fRank').value = r.rank || '';
  $('fRarity').value = rarity;
  $('fCondition').value = r.condition_notes || '';
  $('fKeyword').value = r.search_keyword || '';
}

$('toMarketBtn').addEventListener('click', async () => {
  const keyword = $('fKeyword').value || `${$('fSeries').value} ${$('fName').value}`.trim();
  $('fKeyword').value = keyword;
  await renderLinks(keyword);
  $('market').hidden = false;
  step(3);
  $('market').scrollIntoView({behavior:'smooth', block:'start'});
});

$('fKeyword').addEventListener('change', e => renderLinks(e.target.value));

async function renderLinks(keyword){
  const res = await fetch('/api/market?keyword=' + encodeURIComponent(keyword));
  const m = await res.json();
  $('links').innerHTML = `
    <a href="${m.mercari_sold}" target="_blank" rel="noopener">メルカリ 売り切れ<small>実際に売れた値段</small></a>
    <a href="${m.mercari_onsale}" target="_blank" rel="noopener">メルカリ 出品中<small>いまの売り希望値</small></a>
    <a href="${m.mandarake}" target="_blank" rel="noopener">まんだらけ<small>店頭の買い取り基準</small></a>`;
}

$('backBtn').addEventListener('click', () => $('result').scrollIntoView({behavior:'smooth'}));

$('saveBtn').addEventListener('click', async () => {
  const btn = $('saveBtn');
  btn.disabled = true;
  say($('saveStatus'), 'pCloudへ送信中…', '');
  const record = {
    ...result,
    category: $('fCategory').value,
    series: $('fSeries').value,
    name: $('fName').value,
    number: $('fNumber').value,
    rank: $('fRank').value,
    rarity: Number($('fRarity').value) || 1,
    condition_notes: $('fCondition').value,
    search_keyword: $('fKeyword').value,
    price_min: Number($('fMin').value) || null,
    price_max: Number($('fMax').value) || null,
    price_note: $('fPriceNote').value,
    saved_at: new Date().toISOString()
  };
  try{
    const body = new FormData();
    body.append('record', JSON.stringify(record));
    body.append('front', files.front);
    body.append('back', files.back);
    const res = await fetch('/api/save', { method:'POST', body });
    if(!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const saved = await res.json();
    say($('saveStatus'), '保存しました。', 'ok');
    $('destNote').textContent = saved.path + ' に ' + saved.files.join(' / ');
    step(4);
    loadLedger();
  }catch(err){
    say($('saveStatus'), '保存できませんでした。' + err.message, 'error');
  }finally{
    btn.disabled = false;
  }
});

async function loadLedger(){
  try{
    const res = await fetch('/api/records?limit=20');
    const data = await res.json();
    const order = ['ビックリマン','食玩','トレカ'];
    $('tallies').innerHTML = order.map(c => {
      const hit = data.summary.find(s => s.category === c);
      return `<div class="tally"><b>${hit ? hit.count : 0}</b><span>${c}</span></div>`;
    }).join('');
    $('log').innerHTML = data.items.length
      ? data.items.map(i => `<li><span style="color:var(--text)">${i.name || '名称不明'}</span><span>${i.category} ★${i.rarity||1}</span></li>`).join('')
      : '<li style="color:var(--muted);border:0">まだ1枚も登録されていません。上で撮ってください。</li>';
  }catch(e){ /* 台帳は取れなくても撮影は続けられる */ }
}
loadLedger();
</script>
</body>
</html>
