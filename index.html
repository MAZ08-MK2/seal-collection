<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>シールコレクション AI</title>

<style>
:root{
  --blue:#1677ff;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --bg:#f5f7fb;
  --line:#dde3ee;
  --text:#172033;
  --sub:#667085;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
}

main{
  max-width:680px;
  margin:auto;
  padding:20px 14px 42px;
}

h1{
  font-size:23px;
  text-align:center;
  margin:8px 0 4px;
}

.lead{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  line-height:1.6;
  margin:0 0 4px;
}

.buildStamp{
  text-align:center;
  color:#9aa5b8;
  font-size:11px;
  margin:0 0 18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #16213a0a;
}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:0 0 6px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  font:inherit;
  background:#fff;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.photo{
  border:2px dashed #b8c3d6;
  border-radius:13px;
  min-height:160px;
  padding:10px;
  text-align:center;
  cursor:pointer;
  color:var(--sub);
  font-size:13px;
}

.photo img{
  width:100%;
  height:118px;
  object-fit:contain;
  display:none;
  margin-top:8px;
  border-radius:8px;
}

.photo input{
  display:none;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.btn.secondary{
  background:#eef4ff;
  color:#125dc9;
}

.btn.green{
  background:var(--green);
}

.full{
  width:100%;
  margin-top:12px;
}

.status,
.error,
.warning,
.success{
  margin-top:11px;
  padding:10px;
  border-radius:9px;
  font-size:13px;
  white-space:pre-wrap;
  line-height:1.5;
}

.status{
  display:none;
  background:#eff6ff;
  color:#1957a7;
}

.error{
  display:none;
  background:#fff1f2;
  color:#a9162b;
}

.warning{
  display:none;
  background:#fff7ed;
  color:#9a3412;
}

.success{
  display:none;
  background:#ecfdf3;
  color:#166534;
}

.result{
  display:none;
}

.fields{
  display:grid;
  gap:10px;
}

.hint,
.muted{
  color:var(--sub);
  font-size:12px;
  line-height:1.5;
}

.hint{
  margin-top:7px;
}

.marketBox{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-top:4px;
}

.marketTitle{
  font-weight:700;
  margin-bottom:8px;
}

.aiBadge{
  display:inline-block;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  background:#eef4ff;
  color:#125dc9;
  margin-bottom:8px;
}

.sourceBox{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  font-size:11px;
  line-height:1.6;
  color:var(--sub);
  word-break:break-word;
}

.sourceBox a{
  color:#1769d1;
  text-decoration:none;
}

.sourceTitle{
  font-weight:700;
  color:var(--text);
  margin-bottom:5px;
}

.confirmBox{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}

.confirmTitle{
  font-weight:700;
  color:#166534;
  margin-bottom:6px;
}

.confirmText{
  font-size:12px;
  color:#166534;
  line-height:1.6;
}

#cardView{
  display:none;
}

.screenshotWrap{
  background:#fff;
  border-radius:22px;
  padding:22px 18px 26px;
  border:1px solid var(--line);
  box-shadow:0 4px 18px #16213a12;
}

.screenshotHeader{
  text-align:center;
  font-size:12px;
  color:var(--sub);
  letter-spacing:.04em;
  margin-bottom:14px;
}

.screenshotPhotos{
  display:flex;
  gap:10px;
  margin-bottom:16px;
}

.screenshotPhotos img{
  flex:1;
  width:0;
  min-height:150px;
  max-height:260px;
  object-fit:contain;
  background:#f1f5f9;
  border-radius:16px;
  border:1px solid var(--line);
}

.screenshotPhotos.single img{
  max-height:320px;
}

.screenshotName{
  font-size:21px;
  font-weight:800;
  margin:0 0 3px;
  text-align:center;
}

.screenshotSeries{
  text-align:center;
  color:var(--sub);
  font-size:13px;
  margin:0 0 14px;
}

.screenshotBadges{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin-bottom:16px;
}

.badge{
  font-size:13px;
  padding:6px 12px;
  border-radius:999px;
}

.kindBadge{
  background:#eef4ff;
  color:#125dc9;
}

.rarityBadge{
  background:#fff7ed;
  color:#9a3412;
}

.screenshotPriceBox{
  text-align:center;
  background:#ecfdf3;
  border:1px solid #bbf7d0;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

.screenshotPriceLabel{
  font-size:12px;
  color:#166534;
  margin-bottom:4px;
}

.screenshotPrice{
  font-size:24px;
  font-weight:800;
  color:#166534;
}

.screenshotMemoLabel{
  font-size:12px;
  font-weight:700;
  color:var(--sub);
  margin-bottom:4px;
}

.screenshotMemo{
  font-size:13px;
  line-height:1.6;
  background:#f8fafc;
  border-radius:12px;
  padding:12px;
  white-space:pre-wrap;
}

.screenshotMeta{
  text-align:right;
  font-size:11px;
  color:#9aa5b8;
  margin-top:14px;
}

.instructionBox{
  background:#eff6ff;
  border:1px solid #bfdbfe;
  border-radius:14px;
  padding:14px;
  margin-top:16px;
  font-size:13px;
  color:#1957a7;
  line-height:1.7;
}

.divider{
  height:1px;
  background:var(--line);
  margin:15px 0;
}

@media(max-width:390px){
  .grid{
    gap:7px;
  }

  .photo{
    min-height:140px;
  }

  .screenshotPhotos img{
    min-height:120px;
  }
}
</style>
</head>

<body>

<main>

<h1>✨ シールコレクション AI</h1>

<p class="lead">
画像判定・Google検索・レア度・相場を一度に調査します。<br>
検索制限時は自動で画像判定のみへ切り替えます。
</p>

<p class="buildStamp"></p>


<div id="formView">

<section class="card">

<label for="apiKey">
Gemini API Key
</label>

<input
id="apiKey"
type="password"
autocomplete="off"
placeholder="Gemini APIキーを貼り付け">

APIキーはこの端末・このブラウザ内に保存されます。
</p>

</section>


<section class="card">

<div class="grid">

<label class="photo">

🖼 表面の画像

<input
id="front"
type="file"
accept="image/*">

<img
id="frontPreview"
alt="表面のプレビュー">

</label>


<label class="photo">

🖼 裏面の画像（任意）

<input
id="back"
type="file"
accept="image/*">

<img
id="backPreview"
alt="裏面のプレビュー">

</label>

</div>


<button
id="scanBtn"
class="btn full"
type="button">

🔎 AIで判定する

</button>


<div id="scanStatus" class="status"></div>
<div id="scanWarning" class="warning"></div>
<div id="scanSuccess" class="success"></div>
<div id="scanError" class="error"></div>

</section>


<section
id="resultCard"
class="card result">

<div class="row">

<label style="margin:0;">
AI判定結果
</label>

<span class="aiBadge">
AI判定済み
</span>

</div>


<div class="fields">

<div>

<label for="name">
シール名
</label>

<input
id="name"
type="text"
placeholder="シール名">

</div>


<div>

<label for="series">
シリーズ・作品名
</label>

<input
id="series"

<div>

<input
id="rarity"

<div
id="screenshotPhotos"

<img
id="screenshotFront"

<img
id="screenshotBack"
alt="裏面">

</div>


<h2
id="screenshotName"
class="screenshotName">

</p>

現在の相場

id="screenshotPrice"

<script>

const MODEL =
  "gemini-3.6-flash";

const API_URL =
  "https://generativelanguage.googleapis.com/v1beta/models/"
  + MODEL
  + ":generateContent";

const BUILD =
  "2026-08-15 / Search ON + 429 Fallback";


const $ =
  id =>
    document.getElementById(id);


const apiKeyEl = $("apiKey");
const frontEl = $("front");
const backEl = $("back");
const frontPreview = $("frontPreview");
const backPreview = $("backPreview");
const scanBtn = $("scanBtn");
const scanStatus = $("scanStatus");
const scanWarning = $("scanWarning");
const scanSuccess = $("scanSuccess");
const scanError = $("scanError");
const resultCard = $("resultCard");
const nameEl = $("name");
const seriesEl = $("series");
const kindEl = $("kind");
const rarityEl = $("rarity");
const priceEl = $("price");
const researchMemoEl = $("researchMemo");
const sourcesEl = $("sources");
const confirmBtn = $("confirmBtn");
const formView = $("formView");
const cardView = $("cardView");
const screenshotPhotos = $("screenshotPhotos");
const screenshotFront = $("screenshotFront");
const screenshotBack = $("screenshotBack");
const screenshotName = $("screenshotName");
const screenshotSeries = $("screenshotSeries");
const screenshotKind = $("screenshotKind");
const screenshotRarity = $("screenshotRarity");
const screenshotPrice = $("screenshotPrice");
const screenshotMemo = $("screenshotMemo");
const screenshotMeta = $("screenshotMeta");
const backBtn = $("backBtn");


const savedApiKey =
  localStorage.getItem(
    "seal_gemini_api_key"
  );

if(savedApiKey){
  apiKeyEl.value =
    savedApiKey;
}


apiKeyEl.addEventListener(
  "change",
  () => {

    const value =
      apiKeyEl.value.trim();

    if(value){

      localStorage.setItem(
        "seal_gemini_api_key",
        value
      );

    }

  }
);


let frontData = null;
let backData = null;
let frontMime = null;
let backMime = null;


function loadImage(
  file,
  previewEl,
  type
){

  if(!file){
    return;
  }

  if(
    !file.type.startsWith(
      "image/"
    )
  ){

    showError(
      "画像ファイルを選択してください。"
    );

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      const result =
        reader.result;

      previewEl.src =
        result;

      previewEl.style.display =
        "block";


      if(
        type === "front"
      ){

        frontData =
          result.split(",")[1];

        frontMime =
          file.type;

      }else{

        backData =
          result.split(",")[1];

        backMime =
          file.type;

      }

    };


  reader.readAsDataURL(
    file
  );

}


frontEl.addEventListener(
  "change",
  () =>
    loadImage(
      frontEl.files[0],
      frontPreview,
      "front"
    )
);


backEl.addEventListener(
  "change",
  () =>
    loadImage(
      backEl.files[0],
      backPreview,
      "back"
    )
);


function hideMessages(){

  scanStatus.style.display =
    "none";

  scanWarning.style.display =
    "none";

  scanSuccess.style.display =
    "none";

  scanError.style.display =
    "none";

}


function showStatus(message){

  scanStatus.textContent =
    message;

  scanStatus.style.display =
    "block";

}


function showWarning(message){

  scanWarning.textContent =
    message;

  scanWarning.style.display =
    "block";

}


function showSuccess(message){

  scanSuccess.textContent =
    message;

  scanSuccess.style.display =
    "block";

}


function showError(message){

  scanError.textContent =
    message;

  scanError.style.display =
    "block";

}


/* =========================================================
   JSON解析
========================================================= */

function extractJson(text){

  if(!text){

    throw new Error(
      "Geminiから回答が返されませんでした。"
    );

  }


  let cleaned =
    text.trim()
      .replace(
        /^```json\s*/i,
        ""
      )
      .replace(
        /^```\s*/i,
        ""
      )
      .replace(
        /\s*```$/i,
        ""
      );


  try{

    return JSON.parse(
      cleaned
    );

  }catch(e){}


  const first =
    cleaned.indexOf("{");

  const last =
    cleaned.lastIndexOf("}");


  if(
    first >= 0 &&
    last > first
  ){

    try{

      return JSON.parse(
        cleaned.slice(
          first,
          last + 1
        )
      );

    }catch(e){}

  }


  throw new Error(
    "Geminiの回答をJSONとして解析できませんでした。"
  );

}


/* =========================================================
   参照元
========================================================= */

function renderSources(
  groundingMetadata
){

  sourcesEl.innerHTML =
    "";


  if(
    !groundingMetadata
  ){

    sourcesEl.textContent =
      "参照元は取得できませんでした。";

    return;

  }


  const chunks =
    groundingMetadata.groundingChunks ||
    groundingMetadata.grounding_chunks ||
    [];


  if(
    !chunks.length
  ){

    sourcesEl.textContent =
      "参照元URLは取得できませんでした。";

    return;

  }


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "sourceTitle";

  title.textContent =
    "Google検索の参照元";

  sourcesEl.appendChild(
    title
  );


  chunks.forEach(
    (
      chunk,
      index
    ) => {

      const web =
        chunk.web ||
        chunk;


      const uri =
        web.uri ||
        web.url ||
        "";


      const sourceTitle =
        web.title ||
        uri ||
        `参照元 ${index + 1}`;


      const div =
        document.createElement(
          "div"
        );


      if(uri){

        const a =
          document.createElement(
            "a"
          );

        a.href =
          uri;

        a.target =
          "_blank";

        a.rel =
          "noopener noreferrer";

        a.textContent =
          `${index + 1}. ${sourceTitle}`;

        div.appendChild(
          a
        );

      }else{

        div.textContent =
          `${index + 1}. ${sourceTitle}`;

      }


      sourcesEl.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   プロンプト
========================================================= */

function buildPrompt(
  useSearch
){

  if(useSearch){

    return `
あなたは日本のコレクション品を調査する専門AIです。

画像とGoogle検索を使って、
シール名、シリーズ、種類、レア度、現在の相場を判定してください。

【重要】
・画像を最優先
・表裏を照合
・旧版、復刻版、仕様違いを区別
・推測しない
・相場は現在確認できる日本国内の販売・取引情報を参考
・確認できない場合は「確認できません」

必ずJSONだけを返してください。

{
  "name":"シール名",
  "series":"シリーズ",
  "kind":"シール",
  "rarity":"レア度",
  "price":"〇〇円～〇〇円",
  "researchMemo":"判定理由と相場根拠",
  "confidence":"高・中・低"
}
`;

  }


  return `
あなたは日本のコレクション品を画像から判定する専門AIです。

今回はGoogle検索を使用しません。

画像のみから、
シール名、シリーズ、種類、レア度を判定してください。

【重要】
・表裏を照合
・推測しない
・相場は検索できないため必ず「確認できません」

必ずJSONだけを返してください。

{
  "name":"シール名",
  "series":"シリーズ",
  "kind":"シール",
  "rarity":"レア度",
  "price":"確認できません",
  "researchMemo":"画像から確認できた内容",
  "confidence":"高・中・低"
}
`;

}


/* =========================================================
   Gemini API
========================================================= */

async function callGemini(
  useSearch
){

  const apiKey =
    apiKeyEl.value.trim();


  const parts =
    [

      {
        text:
          buildPrompt(
            useSearch
          )
      },

      {
        inline_data:{
          mime_type:
            frontMime ||
            "image/jpeg",

          data:
            frontData
        }
      }

    ];


  if(
    backData
  ){

    parts.push({

      inline_data:{
        mime_type:
          backMime ||
          "image/jpeg",

        data:
          backData
      }

    });

  }


  const body = {

    contents:[
      {
        role:
          "user",

        parts:
          parts
      }
    ],

    generationConfig:{

      temperature:
        0.1,

      responseMimeType:
        "application/json"

    }

  };


  if(
    useSearch
  ){

    body.tools =
      [
        {
          google_search:{}
        }
      ];

  }


  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers:{

          "Content-Type":
            "application/json",

          "x-goog-api-key":
            apiKey

        },

        body:
          JSON.stringify(
            body
          )

      }
    );


  if(
    !response.ok
  ){

    const text =
      await response.text();


    const error =
      new Error(
        text
      );


    error.code =
      response.status;


    throw error;

  }


  const data =
    await response.json();


  const candidate =
    data?.candidates?.[0];


  const text =
    candidate?.content?.parts
      ?.map(
        p =>
          p.text ||
          ""
      )
      .join("")
      .trim();


  return {

    result:
      extractJson(
        text
      ),

    groundingMetadata:
      candidate?.groundingMetadata ||
      candidate?.grounding_metadata ||
      null

  };

}


/* =========================================================
   AI判定
========================================================= */

scanBtn.addEventListener(
  "click",
  async () => {

    hideMessages();


    if(
      !frontData
    ){

      showError(
        "表面の画像を選択してください。"
      );

      return;

    }


    if(
      !apiKeyEl.value.trim()
    ){

      showError(
        "Gemini API Keyを入力してください。"
      );

      return;

    }


    localStorage.setItem(
      "seal_gemini_api_key",
      apiKeyEl.value.trim()
    );


    scanBtn.disabled =
      true;


    scanBtn.textContent =
      "🔎 AI判定中…";


    resultCard.style.display =
      "none";


    try{

      showStatus(
        "Google検索付きで判定しています…"
      );


      let responseData;


      try{

        responseData =
          await callGemini(
            true
          );

      }
      catch(
        error
      ){

        if(
          error.code !==
          429
        ){

          throw error;

        }


        showWarning(
          "Google検索付き判定が429になりました。\n"
          + "画像判定のみへ自動で切り替えます。"
        );


        showStatus(
          "Google検索なしで画像判定を再実行しています…"
        );


        responseData =
          await callGemini(
            false
          );


        responseData.fallback =
          true;

      }


      const result =
        responseData.result;


      nameEl.value =
        String(
          result?.name ||
          ""
        ).trim();


      seriesEl.value =
        String(
          result?.series ||
          ""
        ).trim();


      const kind =
        String(
          result?.kind ||
          "シール"
        ).trim();


      kindEl.value =
        Array.from(
          kindEl.options
        ).some(
          option =>
            option.value ===
            kind
        )
          ? kind
          : "シール";


      rarityEl.value =
        String(
          result?.rarity ||
          "確認できません"
        ).trim();


      priceEl.value =
        String(
          result?.price ||
          "確認できません"
        ).trim();


      researchMemoEl.value =
        String(
          result?.researchMemo ||
          ""
        ).trim();


      if(
        responseData.fallback
      ){

        sourcesEl.textContent =
          "Google検索が429のため、今回は画像判定のみです。";


        showSuccess(
          "画像判定は完了しました。\n"
          + "Google検索が制限されたため、相場は確認できません。"
        );

      }else{

        renderSources(
          responseData.groundingMetadata
        );


        showSuccess(
          "AI判定・Google検索・相場調査が完了しました。"
        );

      }


      resultCard.style.display =
        "block";


      resultCard.scrollIntoView({
        behavior:
          "smooth",

        block:
          "start"
      });

    }
    catch(
      error
    ){

      console.error(
        error
      );


      showError(
        "Gemini APIエラー\n\n"
        + (
            error.message ||
            "確認できません"
          )
      );

    }
    finally{

      scanBtn.disabled =
        false;


      scanBtn.textContent =
        "🔎 AIで判定する";

    }

  }
);


/* =========================================================
   確定
========================================================= */

confirmBtn.addEventListener(
  "click",
  () => {

    const confirmed = {

      name:
        nameEl.value.trim(),

      series:
        seriesEl.value.trim(),

      kind:
        kindEl.value.trim(),

      rarity:
        rarityEl.value.trim(),

      price:
        priceEl.value.trim(),

      researchMemo:
        researchMemoEl.value.trim(),

      front:
        frontPreview.src ||
        "",

      back:
        backPreview.src ||
        ""

    };


    screenshotName.textContent =
      confirmed.name;


    screenshotSeries.textContent =
      confirmed.series;


    screenshotKind.textContent =
      confirmed.kind;


    screenshotRarity.textContent =
      confirmed.rarity;


    screenshotPrice.textContent =
      confirmed.price;


    screenshotMemo.textContent =
      confirmed.researchMemo ||
      "調査メモなし";


    screenshotFront.src =
      confirmed.front;


    if(
      confirmed.back
    ){

      screenshotBack.src =
        confirmed.back;

      screenshotBack.style.display =
        "block";

      screenshotPhotos.classList.remove(
        "single"
      );

    }else{

      screenshotBack.style.display =
        "none";

      screenshotPhotos.classList.add(
        "single"
      );

    }


    screenshotMeta.textContent =
      "確定日："
      + new Date()
          .toLocaleDateString(
            "ja-JP"
          );


    formView.style.display =
      "none";


    cardView.style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


backBtn.addEventListener(
  "click",
  () => {

    cardView.style.display =
      "none";


    formView.style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


document.querySelector(
  ".buildStamp"
).textContent =
  BUILD;


hideMessages();

</script>

</body>
</html>
