<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>シールコレクション AI</title>

  <style>
    :root{
      --blue:#1677ff;
      --green:#16a34a;
      --red:#dc2626;
      --orange:#ea580c;
      --bg:#f5f7fb;
      --line:#dde3ee;
      --text:#172033;
      --sub:#667085;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
    }

    main{
      max-width:680px;
      margin:auto;
      padding:20px 14px 42px;
    }

    h1{
      font-size:23px;
      text-align:center;
      margin:8px 0 4px;
    }

    .lead{
      text-align:center;
      color:var(--sub);
      font-size:13px;
      margin:0 0 18px;
    }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      margin:12px 0;
      box-shadow:0 2px 10px #16213a0a;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
    }

    .muted,
    .hint{
      color:var(--sub);
      font-size:12px;
      line-height:1.5;
    }

    .hint{
      margin-top:7px;
    }

    label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin:0 0 6px;
    }

    input,
    textarea,
    select{
      width:100%;
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px;
      font:inherit;
      background:#fff;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .photo{
      border:2px dashed #b8c3d6;
      border-radius:13px;
      min-height:160px;
      padding:10px;
      text-align:center;
      cursor:pointer;
      color:var(--sub);
      font-size:13px;
    }

    .photo img{
      width:100%;
      height:118px;
      object-fit:contain;
      display:none;
      margin-top:8px;
      border-radius:8px;
    }

    .photo input{
      display:none;
    }

    .btn{
      border:0;
      border-radius:11px;
      padding:12px 14px;
      background:var(--blue);
      color:#fff;
      font-weight:700;
      font-size:14px;
      cursor:pointer;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .btn.secondary{
      background:#eef4ff;
      color:#125dc9;
    }

    .btn.green{
      background:var(--green);
    }

    .btn.red{
      background:var(--red);
    }

    .btn.orange{
      background:var(--orange);
    }

    .btn.small{
      padding:8px 10px;
      font-size:12px;
      width:auto;
    }

    .full{
      width:100%;
      margin-top:12px;
    }

    .status,
    .error,
    .warning,
    .success{
      margin-top:11px;
      padding:10px;
      border-radius:9px;
      font-size:13px;
      white-space:pre-wrap;
      line-height:1.5;
    }

    .status{
      display:none;
      background:#eff6ff;
      color:#1957a7;
    }

    .error{
      display:none;
      background:#fff1f2;
      color:#a9162b;
    }

    .warning{
      display:none;
      background:#fff7ed;
      color:#9a3412;
    }

    .success{
      display:none;
      background:#ecfdf3;
      color:#166534;
    }

    .result{
      display:none;
    }

    .fields{
      display:grid;
      gap:10px;
    }

    .item{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
    }

    .item:last-child{
      border:0;
    }

    .thumb{
      width:64px;
      height:64px;
      object-fit:cover;
      border-radius:10px;
      background:#edf1f7;
      flex:none;
    }

    .item h3{
      font-size:15px;
      margin:0 0 3px;
    }

    .item p{
      font-size:12px;
      color:var(--sub);
      margin:2px 0;
    }

    .item .grow{
      flex:1;
      min-width:0;
    }

    .badge{
      font-size:12px;
      color:#17643b;
      background:#e9f9ef;
      padding:5px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .marketBox{
      background:#f8fafc;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      margin-top:4px;
    }

    .marketTitle{
      font-weight:700;
      margin-bottom:8px;
    }

    .marketButtons{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .priceRow{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:8px;
      align-items:center;
      margin-top:8px;
    }

    .priceRow span{
      font-size:12px;
      color:var(--sub);
    }

    .source{
      font-size:11px;
      color:var(--sub);
      line-height:1.5;
      margin-top:8px;
    }

    .hidden{
      display:none !important;
    }

    code{
      background:#f1f5f9;
      padding:2px 4px;
      border-radius:4px;
    }

    @media(max-width:390px){

      .grid{
        gap:7px;
      }

      .photo{
        min-height:140px;
      }

      .marketButtons{
        grid-template-columns:1fr;
      }

      .priceRow{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>✨ シールコレクション AI</h1>

  <p class="lead">

<script>

/* =========================================================
   基本設定
========================================================= */


/*
 * pCloud My AppsのClient IDをここに入れる
 */
const PCLOUD_CLIENT_ID =
  'VvTvHaowOR0';


/*
 * Google公式のStableモデル
 *
 * 2026年7月21日更新
 */
const GEMINI_MODEL =
  'gemini-3-flash-preview';


/*
 * pCloudの保存先
 */
const ROOT_FOLDER =
  '8.seal collection';


/* =========================================================
   DOM
========================================================= */

const $ =
  id => document.getElementById(id);


const store =
  localStorage;


let analysis =
  null;


let records =
  [];


/* =========================================================
   メッセージ
========================================================= */

function setStatus(text){

  $('status').textContent =
    text;

  $('status').style.display =
    text ? 'block' : 'none';

}


function setWarning(text){

  $('warning').textContent =
    text;

  $('warning').style.display =
    text ? 'block' : 'none';

}


function setSuccess(text){

  $('success').textContent =
    text;

  $('success').style.display =
    text ? 'block' : 'none';

}


function fail(error){

  console.error(error);


  setStatus('');
  setWarning('');
  setSuccess('');


  let message =
    error?.message ||
    String(error);


  /*
   * Gemini Quota
   */

  if(
    /quota/i.test(message) ||
    /rate limit/i.test(message) ||
    /exceeded/i.test(message) ||
    /429/.test(message)
  ){

    message =
      'Gemini APIの利用上限に達しています。\n\n' +
      'Google AI StudioのUsage / Rate Limitを確認してください。\n\n' +
      'これはJSONエラーではなく、Gemini API側の利用上限です。';

  }


  /*
   * JSON
   */

  if(
    /JSON Parse/i.test(message) ||
    /Unexpected token/i.test(message) ||
    /Property name must be a string/i.test(message)
  ){

    message =
      'Geminiから正しいJSON形式の判定結果を受け取れませんでした。\n\n' +
      'もう一度「AIで判定する」を押してください。';

  }


  $('error').textContent =
    message;


  $('error').style.display =
    'block';

}


function clearMessage(){

  $('error').style.display =
    'none';

  setWarning('');
  setSuccess('');
  setStatus('');

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function esc(text){

  return String(text ?? '')
    .replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================================
   ID
========================================================= */

function uid(){

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2,8)
  );

}


/* =========================================================
   MIME
========================================================= */

function mime(file){

  return file.type ||
    'image/jpeg';

}


/* =========================================================
   画像プレビュー
========================================================= */

function preview(
  input,
  image
){

  const file =
    input.files[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      image.src =
        reader.result;

      image.style.display =
        'block';

    };


  reader.readAsDataURL(file);

}


$('front').onchange =
  () =>
    preview(
      $('front'),
      $('frontPreview')
    );


$('back').onchange =
  () =>
    preview(
      $('back'),
      $('backPreview')
    );


/* =========================================================
   Gemini API Key
========================================================= */

function saveKey(){

  store.setItem(
    'stickerGeminiKey',
    $('apiKey').value.trim()
  );

}


/* =========================================================
   pCloud
========================================================= */

function apiHost(){

  return (
    store.getItem(
      'pcloudHost'
    ) ||
    'api.pcloud.com'
  );

}


function token(){

  return store.getItem(
    'pcloudToken'
  );

}


function updateCloud(){

  const connected =
    !!token();


  $('cloudState').textContent =
    connected
      ? '接続済み'
      : '未接続';


  $('loginBtn')
    .classList
    .toggle(
      'hidden',
      connected
    );


  $('logoutBtn')
    .classList
    .toggle(
      'hidden',
      !connected
    );

}


function redirectURI(){

  return location.href
    .split('#')[0];

}


/* =========================================================
   pCloud OAuth
========================================================= */

function connect(){

  if(
    PCLOUD_CLIENT_ID.includes(
      'PASTE_'
    )
  ){

    throw Error(
      'PCLOUD_CLIENT_IDにpCloudのClient IDを入力してください。'
    );

  }


  if(
    location.protocol === 'file:'
  ){

    throw Error(
      'このHTMLはHTTPSで公開してから使用してください。'
    );

  }


  const state =
    uid();


  store.setItem(
    'pcloudState',
    state
  );


  const params =
    new URLSearchParams({

      client_id:
        PCLOUD_CLIENT_ID,

      response_type:
        'token',

      redirect_uri:
        redirectURI(),

      state

    });


  location.href =
    'https://my.pcloud.com/oauth2/authorize?' +
    params.toString();

}


/* =========================================================
   OAuth戻り
========================================================= */

function readOAuth(){

  if(!location.hash){
    return;
  }


  const params =
    new URLSearchParams(
      location.hash.slice(1)
    );


  if(
    params.get(
      'access_token'
    )
  ){

    if(
      params.get('state') !==
      store.getItem(
        'pcloudState'
      )
    ){

      throw Error(
        'pCloud認証の確認値が一致しません。もう一度接続してください。'
      );

    }


    store.setItem(
      'pcloudToken',
      params.get(
        'access_token'
      )
    );


    store.setItem(
      'pcloudHost',
      params.get(
        'hostname'
      ) ||
      'api.pcloud.com'
    );


    history.replaceState(
      null,
      '',
      redirectURI()
    );

  }


  else if(
    params.get('error')
  ){

    throw Error(
      'pCloud認証が完了しませんでした: ' +
      params.get('error')
    );

  }

}


/* =========================================================
   pCloud API
========================================================= */

async function pcall(
  method,
  params = {},
  form = null
){

  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const url =
    'https://' +
    apiHost() +
    '/' +
    method;


  let options;


  if(form){

    form.append(
      'access_token',
      token()
    );


    options = {

      method:'POST',

      body:form

    };

  }

  else{

    options = {

      method:'POST',

      headers:{
        'Content-Type':
          'application/x-www-form-urlencoded'
      },

      body:
        new URLSearchParams({
          ...params,
          access_token:
            token()
        })

    };

  }


  let response;


  try{

    response =
      await fetch(
        url,
        options
      );

  }

  catch{

    throw Error(
      'pCloudへ接続できませんでした。公開URL・通信環境・pCloud設定を確認してください。'
    );

  }


  let data;


  try{

    data =
      await response.json();

  }

  catch{

    throw Error(
      'pCloudから正しい応答が返りませんでした。'
    );

  }


  if(
    !response.ok ||
    data.result !== 0
  ){

    throw Error(
      'pCloudエラー: ' +
      (
        data.error ||
        data.result ||
        response.status
      )
    );

  }


  return data;

}


/* =========================================================
   pCloudルート
========================================================= */

async function root(){

  const data =
    await pcall(
      'createfolderifnotexists',
      {

        folderid:0,

        name:
          ROOT_FOLDER

      }
    );


  return data.metadata.folderid;

}


/* =========================================================
   pCloudアップロード
========================================================= */

async function upload(
  folderid,
  file,
  filename
){

  const form =
    new FormData();


  form.append(
    'folderid',
    folderid
  );


  form.append(
    'nopartial',
    '1'
  );


  form.append(
    'renameifexists',
    '0'
  );


  form.append(
    'file',
    file,
    filename
  );


  return pcall(
    'uploadfile',
    {},
    form
  );

}


/* =========================================================
   Geminiプロンプト
========================================================= */

/* =========================================================
   Base64
========================================================= */

async function b64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            String(
              reader.result
            );


          const comma =
            result.indexOf(',');


          if(comma < 0){

            reject(
              new Error(
                '画像データを読み込めませんでした。'
              )
            );

            return;

          }


          resolve(
            result.slice(
              comma + 1
            )
          );

        };


      reader.onerror =
        () =>
          reject(
            new Error(
              '画像の読み込みに失敗しました。'
            )
          );


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   Gemini JSON Schema
========================================================= */

const GEMINI_SCHEMA = {

  type:'object',

  properties:{

    name:{

      type:'string',

      description:
        '画像から確認できる商品名。確認できなければ「確認できません」。'

    },

    series:{

      type:'string',

      description:
        'シリーズまたは作品名。確認できなければ「確認できません」。'

    },

    kind:{

      type:'string',

      enum:[
        'シール',

        'R',
        'SR',
        'SSR',
        'SC',

        '不明'
      ]

/* =========================================================
   JSON安全解析
========================================================= */

function safeJsonParse(text){

  if(
    typeof text !== 'string'
  ){

    throw Error(
      'GeminiからJSON文字列を取得できませんでした。'
    );

  }


  let s =
    text
      .trim();


  /*
   * 前後のMarkdownコードブロックを削除
   */

  s =
    s.replace(
      /^```(?:json)?\s*/i,
      ''
    );


  s =
    s.replace(
      /\s*```$/i,
      ''
    );


  s =
    s.trim();


  /*
   * JSONの開始・終了位置を探す
   */

  const start =
    s.indexOf('{');


  const end =
    s.lastIndexOf('}');


  if(
    start < 0 ||
    end <= start
  ){

    throw Error(
      'Geminiの回答にJSONオブジェクトがありません。'
    );

  }


  s =
    s.slice(
      start,
      end + 1
    );


  /*
   * まず通常のJSON.parse
   */

  try{

    return JSON.parse(s);

  }

  catch(firstError){

    console.warn(
      '通常のJSON.parseに失敗しました。',
      firstError,
      s
    );

  }


  /*
   * よくある問題を修正
   *
   * ・スマートクォート
   * ・BOM
   * ・制御文字
   */

  let repaired =
    s
      .replace(
        /^\uFEFF/,
        ''
      )
      .replace(
        /[\u201C\u201D]/g,
        '"'
      )
      .replace(
        /[\u2018\u2019]/g,
        "'"
      );


  /*
   * 改行・タブなどの制御文字
   */

  repaired =
    repaired.replace(
      /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,
      ' '
    );


  try{

    return JSON.parse(
      repaired
    );

  }

  catch(secondError){

    console.error(
      'JSON修復後も解析できません。',
      secondError,
      repaired
    );


    throw Error(
      'JSON Parse error: Geminiから返されたJSONを解析できませんでした。'
    );

  }

}


/* =========================================================
   Gemini判定
========================================================= */

async function scan(){

  clearMessage();


  const key =
    $('apiKey')
      .value
      .trim();


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!key){

    throw Error(
      'Gemini API Keyを入力してください。'
    );

  }


  if(!front){

    throw Error(
      '表面の画像を選択してください。'
    );

  }


  saveKey();


  $('scanBtn').disabled =
    true;


  try{

    setStatus(
      'Gemini 3.6 Flashで画像を解析しています…'
    );


    /*
     * Geminiへ送るparts
     */

    const parts = [

      {
        text:
          buildPrompt()
      },

      {
        inline_data:{

          mime_type:
            mime(front),

          data:
            await b64(front)

        }

      }

    ];


    /*
     * 裏面がある場合
     */

    if(back){

      parts.push({

        inline_data:{

          mime_type:
            mime(back),

          data:
            await b64(back)

        }

      });

    }


    /*
     * Gemini 3.6 Flash
     *
     * temperature等は使用しない。
     */

    const requestBody = {

      contents:[

        {

          role:'user',

          parts:
            parts

        }

      ],

      generationConfig:{

        responseMimeType:
          'application/json',

        responseSchema:
          GEMINI_SCHEMA,

        maxOutputTokens:
          600

      }

    };


    /*
     * API URL
     */

    const url =
      'https://generativelanguage.googleapis.com/v1beta/models/' +
      encodeURIComponent(
        GEMINI_MODEL
      ) +
      ':generateContent?key=' +
      encodeURIComponent(
        key
      );


    let response;


    try{

      response =
        await fetch(
          url,
          {

            method:'POST',

            headers:{
              'Content-Type':
                'application/json'
            },

            body:
              JSON.stringify(
                requestBody
              )

          }
        );

    }

    catch(error){

      throw Error(
        'Gemini APIへ接続できませんでした。\n\n' +
        'ネットワーク接続とAPI Keyを確認してください。'
      );

    }


    let data;


    try{

      data =
        await response.json();

    }

    catch{

      throw Error(
        'Geminiから正しいJSON応答を受け取れませんでした。'
      );

    }


    /*
     * HTTPエラー
     */

    if(!response.ok){

      const message =
        data?.error?.message ||
        (
          'HTTP ' +
          response.status
        );


      /*
       * Quota
       */

      if(
        response.status === 429 ||
        /quota/i.test(message) ||
        /rate limit/i.test(message)
      ){

        throw Error(
          'Gemini APIの利用上限に達しています。\n\n' +
          'Google AI StudioのUsage / Rate Limitを確認してください。\n\n' +
          'これはHTMLのJSON処理エラーではありません。'
        );

      }


      throw Error(
        'Geminiエラー: ' +
        message
      );

    }


    /*
     * candidates
     */

    const candidate =
      data
        ?.candidates?.[0];


    if(!candidate){

      throw Error(
        'Geminiから判定結果が返ってきませんでした。'
      );

    }


    /*
     * finishReason確認
     */

    if(
      candidate.finishReason &&
      candidate.finishReason !== 'STOP'
    ){

      console.warn(
        'Gemini finishReason:',
        candidate.finishReason
      );

    }


    /*
     * text抽出
     */

    const text =
      candidate
        ?.content
        ?.parts
        ?.map(
          part =>
            part.text || ''
        )
        .join('')
        .trim();


    if(!text){

      throw Error(
        'Geminiの判定結果が空でした。\n\n' +
        '画像をもう一度選択して再実行してください。'
      );

    }


    /*
     * 安全にJSON解析
     */

    analysis =
      safeJsonParse(
        text
      );


    /*
     * デフォルト値
     */

    const name =
      typeof analysis.name === 'string'
        ? analysis.name
        : '確認できません';


    const series =
      typeof analysis.series === 'string'
        ? analysis.series
        : '確認できません';


    const kinds = [
      'シール',
      'トレカ',
      '食玩'
    ];


    const rarities = [
      'N',
      'R',
      'SR',
      'SSR',
      'SC',
      'UR',
      'SEC',
      'PR',
      '不明'
    ];


    const kind =
      kinds.includes(
        analysis.kind
      )
        ? analysis.kind
        : 'シール';


    const rarity =
      rarities.includes(
        analysis.rarity
      )
        ? analysis.rarity
        : '不明';


    const memo =
      typeof analysis.memo === 'string'
        ? analysis.memo
        : '';


    /*
     * フォームへ反映
     */

    $('name').value =
      name;


    $('series').value =
      series;


    $('kind').value =
      kind;


    $('rarity').value =
      rarity;


    $('memo').value =
      memo;


    $('mercariPrice').value =
      '';


    $('mandarakePrice').value =
      '';


    $('price').value =
      '';


    /*
     * 結果表示
     */

    $('resultCard').style.display =
      'block';


    setStatus('');


    setSuccess(
      'AI判定が完了しました。\n' +
      '商品名・シリーズ・レア度を確認してください。'
    );


  }

  catch(error){

    throw error;

  }

  finally{

    $('scanBtn').disabled =
      false;

  }

}


/* =========================================================

========================================================= */

function getSearchKeyword(){

  const name =
    $('name')
      .value
      .trim();


  const series =
    $('series')
      .value
      .trim();


  if(
    !name ||
    name === '確認できません'
  ){

    return '';

  }


  if(
    series &&
    series !== '確認できません'
  ){

    return (
      series +
      ' ' +
      name
    );

  }


  return name;

}

/* =========================================================
   pCloud保存
========================================================= */

async function save(){

  clearMessage();


  if(!analysis){

    throw Error(
      '先にAIで判定してください。'
    );

  }


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  const front =
    $('front')
      .files[0];


  const back =
    $('back')
      .files[0];


  if(!front){

    throw Error(
      '表面の画像がありません。'
    );

  }


  $('saveBtn').disabled =
    true;


  try{

    setStatus(
      'pCloudへ保存しています…'
    );


    const rootFolderId =
      await root();


    const item =
      current();


    /*
     * アイテムフォルダ
     */

    const folder =
      await pcall(
        'createfolderifnotexists',
        {

          folderid:
            rootFolderId,

          name:
            'item-' +
            item.id

        }
      );


    const folderid =
      folder.metadata.folderid;


    /*
     * 拡張子
     */

    function ext(file){

      return (
        file.name
          .split('.')
          .pop() ||
        'jpg'
      )
      .replace(
        /[^a-z0-9]/gi,
        ''
      )
      .toLowerCase();

    }


    /*
     * 表面
     */

    await upload(
      folderid,
      front,
      'front.' +
      ext(front)
    );


    /*
     * 裏面
     */

    if(back){

      await upload(
        folderid,
        back,
        'back.' +
        ext(back)
      );

    }


    /*
     * JSON
     */

    item.folderid =
      folderid;


    const dataFile =
      new File(

        [
          JSON.stringify(
            item,
            null,
            2
          )
        ],

        'data.json',

        {
          type:
            'application/json'
        }

      );


    await upload(
      folderid,
      dataFile,
      'data.json'
    );


    /*
     * 一覧用プレビュー
     */

    item.preview =
      $('frontPreview').src;


    records.unshift(
      item
    );


    render();


    setStatus('');


    setSuccess(
      'pCloudに保存しました。'
    );

  }

  finally{

    $('saveBtn').disabled =
      false;

  }

}


/* =========================================================
   pCloud一覧
========================================================= */

async function refresh(){

  clearMessage();


  if(!token()){

    throw Error(
      '先にpCloudへ接続してください。'
    );

  }


  setStatus(
    'pCloudの保存データを確認しています…'
  );


  const rootFolderId =
    await root();


  const data =
    await pcall(
      'listfolder',
      {

        folderid:
          rootFolderId,

        recursive:0

      }
    );


  const folders =
    (
      data.metadata.contents ||
      []
    )
    .filter(
      item =>
        item.isfolder &&
        item.name.startsWith(
          'item-'
        )
    );


  records = [];


  /*
   * 各フォルダのdata.jsonを読む
   */

  for(
    const folder of folders
  ){

    try{

      const files =
        await pcall(
          'listfolder',
          {

            folderid:
              folder.folderid,

            recursive:0

          }
        );


      const jsonFile =
        (
          files.metadata.contents ||
          []
        )
        .find(
          item =>
            !item.isfolder &&
            item.name ===
              'data.json'
        );


      if(jsonFile){

        /*
         * ファイルリンク
         */

        const linkData =
          await pcall(
            'getfilelink',
            {

              fileid:
                jsonFile.fileid,

              forcedownload:1

            }
          );


        const response =
          await fetch(
            linkData.link
          );


        if(response.ok){

          const item =
            await response.json();


          item.folderid =
            folder.folderid;


          records.push(
            item
          );

        }

      }

      else{

        records.push({

          id:
            folder.name.slice(5),

          folderid:
            folder.folderid,

          name:
            '保存済みアイテム',

          series:'',
          kind:'',
          rarity:'',
          price:'',
          mercariPrice:'',
          mandarakePrice:'',
          memo:'',

          savedAt:
            folder.modified

        });

      }

    }

    catch(error){

      console.warn(
        '保存データの読み込み失敗:',
        error
      );


      records.push({

        id:
          folder.name.slice(5),

        folderid:
          folder.folderid,

        name:
          '保存済みアイテム',

        series:'',
        kind:'',
        rarity:'',
        price:'',
        mercariPrice:'',
        mandarakePrice:'',
        memo:'',

        savedAt:
          folder.modified

      });

    }

  }


  /*
   * 新しい順
   */

  records.sort(
    (a,b) =>
      new Date(
        b.savedAt || 0
      ) -
      new Date(
        a.savedAt || 0
      )
  );


  render();


  setStatus('');


  setSuccess(
    records.length +
    '件読み込みました。'
  );

}


/* =========================================================
   削除
========================================================= */

async function del(id){

  const record =
    records.find(
      item =>
        item.id === id
    );


  if(!record){
    return;
  }


  if(
    !confirm(
      'このアイテムをpCloudから削除します。\n\nよろしいですか？'
    )
  ){

    return;

  }


  clearMessage();


  try{

    setStatus(
      'pCloudから削除しています…'
    );


    await pcall(
      'deletefolderrecursive',
      {

        folderid:
          record.folderid

      }
    );


    records =
      records.filter(
        item =>
          item.id !== id
      );


    render();


    setStatus('');


    setSuccess(
      '削除しました。'
    );

  }

  catch(error){

    fail(error);

  }

}


/* =========================================================
   一覧表示
========================================================= */

function render(){

  if(!records.length){

    $('list').innerHTML =
      '<p class="muted">まだ保存されていません。</p>';

    return;

  }


  $('list').innerHTML =
    records
      .map(
        record => `

          <div class="item">

            <div class="grow">

              <h3>
                ${esc(record.name)}
              </h3>

              <p>
                ${esc(record.series)}
                　
                ${esc(record.kind)}
                　
                ${esc(record.rarity)}
              </p>

              <p>
                総合価格：
                ${esc(record.price)}
              </p>

              ${
                record.mercariPrice
                  ? `
                    <p>
                      メルカリ：
                      ${esc(
                        record.mercariPrice
                      )}
                    </p>
                  `
                  : ''
              }

              ${
                record.mandarakePrice
                  ? `
                    <p>
                      まんだらけ：
                      ${esc(
                        record.mandarakePrice
                      )}
                    </p>
                  `
                  : ''
              }

              <p>
                ${
                  record.savedAt
                    ? new Date(
                        record.savedAt
                      )
                      .toLocaleDateString(
                        'ja-JP'
                      )
                    : ''
                }
              </p>

            </div>


            <button
              class="btn small red"
              onclick="del('${esc(record.id)}')">
              削除
            </button>

          </div>

        `
      )
      .join('');

}
